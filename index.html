e était vue comme un feu purificateur : le corps brûle les humeurs impures pour s'en débarrasser. Il fallait tempérer ce feu sans l'éteindre trop brusquement.", "secret": "L'anis ( Pimpinella anisum ) pour expulser, le citron ( Citrus × limon ) pour rafraîchir. • Le Remède : Décoction de tranches de citron, graines d'anis et marrube séché ( Marrubium vulgare ). • L'Action : Boire plusieurs petites tasses tièdes. Appliquer des compresses d'eau vinaigrée sur le front. • L'Effet : Soutient le corps dans son effort et apaise la brûlure interne.", "conseil": "« Ne te couvre point de lourdes laines sous la tente si la fièvre te prend, car tu étoufferais la chaleur que le corps tente d'expulser. Bois l'eau acidulée du citron et repose-toi à l'ombre. La fièvre est une bataille ; laisse ton corps la gagner sans l'entraver. »", "relais": "Hydratation régulière et repos. Paracétamol ou Ibuprofène pour soulager la douleur ou la fièvre. Éviter de trop se couvrir afin de ne pas entretenir l'échauffement du corps.", "vigilance": "Consultez si la fièvre dépasse 40°C, si elle dure plus de 3 jours, ou si elle s'accompagne d'une raideur de la nuque ou de taches rouges sur la peau.", "kw": "fièvre température frissons"}, {"name": "FAIBLESSES CARDIAQUES", "subtitle": "Le Cœur Lassé", "desc": "Affaiblissement de l'ardeur vitale et du siège des émotions.", "diag": "• Signes : Palpitations, essoufflement rapide, fatigue inhabituelle à l'effort.", "anciens": "Attribuées à une défaillance du cœur, considéré comme le foyer de la chaleur vitale. Si le bois manque au feu, le cœur faiblit et le souffle s'amenuise.", "secret": "Le duo du réconfort cardiaque et des forces affaiblies. • Le Remède : Infusion d'aubépine et d'un éclat de cannelle. • L'Action : Laisser infuser à couvert dans une eau frémissante et boire une à deux tasses par jour durant les périodes de fatigue ou de tension de l'esprit. • L'Effet : L'aubépine était réputée apaiser les battements désordonnés du cœur et calmer l'agitation intérieure, tandis que la cannelle réchauffait le corps et soutenait les forces vitales.", "conseil": "« Le cœur du chevalier est son premier bouclier. S'il s'emballe sans raison ou s'essouffle à la moindre charge, dépose ton épée et cherche le calme. L'aubépine est la plante du cœur fidèle : elle redonne la mesure à celui qui a trop présumé de ses forces. »", "relais": "Extraits fluides d'Aubépine. Gestion du stress. L'aubépine est officiellement reconnue pour les palpitations liées à l'anxiété légère.", "vigilance": "Une douleur oppressante dans la poitrine, un essoufflement au repos ou un malaise brutal nécessitent un avis médical urgent (15/112).", "kw": "cœur palpitations essoufflement"}, {"name": "FATIGUE", "subtitle": "Le Souffle de l'Épuisement", "desc": "Épuisement des forces vitales après l'effort ou la maladie.", "diag": "• Signes : Lassitude persistante, manque d'énergie dès le réveil, corps lourd. • Sensation : Esprit embrumé, difficulté à accomplir les tâches quotidiennes.", "anciens": "La fatigue était vue comme une consommation excessive de la chaleur vitale. Le corps, tel une lampe manquant d'huile, ne peut plus entretenir sa flamme intérieure. Il faut alors \"nourrir le sang\" pour restaurer la vigueur.", "secret": "L'Ortie ( Urtica dioica ) et les fruits nourrissants étaient des alliés de la &#x201C;reconstruction&#x201D; après fatigue, blessure ou disette. • Le Remède : Soupe d'orties fraîches ou infusion de feuilles séchées. • L'Action : Prendre une écuelle de soupe, ou boire l'infusion matin, midi et soir. Ajouter à la pitance des aliments denses : dattes ( Phoenix dactylifera ) et châtaignes ( Castanea sativa ), pour soutenir les forces. • L'Effet : Reminéralise le corps en profondeur et réveille l'énergie dormante.", "conseil": "« Frère, si ton épée te semble peser un quintal et ton bouclier un roc, n'attends pas que ton corps s'effondre. La fatigue est un avertissement de l'âme. Cherche la vigueur dans l'ortie des chemins et la douceur des fruits d'Orient pour retrouver ton pas de marche. »", "relais": "Tisanes d'ortie ou gélules de poudre d'ortie. Consommation de fruits secs énergétiques (amandes, dattes). Hygiène de vie : sommeil régulier et alimentation équilibrée.", "vigilance": "L'ortie est diurétique ; prudence en cas d'insuffisance rénale, de traitement diurétique/anticoagulant, ou si vous êtes enceinte. Consultez si la fatigue est si intense qu'elle empêche toute activité, si elle s'accompagne d'une perte de poids inexpliquée ou de sueurs nocturnes.", "kw": "épuisement lassitude asthénie"}, {"name": "GANGLIONS", "subtitle": "L'Alerte des Humeurs", "desc": "Gonflement des sentinelles du corps face à une infection.", "diag": "• Signes : Petite \"boule\" mobile et sensible sous la peau (cou, aisselle, aine). • Sensation : Chaleur locale et douleur au toucher.", "anciens": "Interprétés comme des poches où le corps \"emprisonne\" les humeurs corrompues pour les drainer. Il faut aider ce drainage par des plantes de clarté.", "secret": "Le Bouleau ( Betula pubescens ) est l'arbre de la purification par excellence. • Le Remède : Compresses de feuilles de bouleau tièdes. • L'Action : Faire chauffer les feuilles dans un peu d'eau, puis appliquer sur le gonflement. • L'Effet : Aide à fluidifier les humeurs stagnantes et calme l'inflammation.", "conseil": "« Si une bosse de chair apparaît sous ta gorge, c'est que ton corps livre bataille contre un mal invisible. Sois patient, frère. Garde la zone au chaud et aide la nature à laver ses conduits par le bouleau. Si la boule durcit comme la pierre, mande le médecin. »", "relais": "Compresses tièdes et humides. Hydratation abondante. Repos pour permettre au système immunitaire de travailler.", "vigilance": "Consultez impérativement si le ganglion est dur, s'il grossit rapidement, s'il persiste plus de deux semaines ou s'il s'accompagne d'une forte fièvre ou de difficultés à avaler.", "kw": "écrouelles gorge cou"}, {"name": "GALE", "subtitle": "Le Feu de l'Épiderme", "desc": "Impureté profonde de la peau provoquant des démangeaisons cruelles.", "diag": "• Signes : Démangeaisons insupportables la nuit, petites galeries sous la peau. • Lésions : Souvent entre les doigts, aux poignets ou aux coudes.", "anciens": "La gale était crainte dans les commanderies comme une marque de \"corruption du sang\". Elle se propageait là où les hommes vivaient serrés.", "secret": "La Lavande ( Lavandula angustifolia ) assainit les chairs et apaise le prurit. • Le Remède : Décoction forte de fleurs de lavande. • L'Action : Appliquer en compresses sur les zones irritées. Autrefois, on y associait le soufre. • L'Effet : Calme l'envie de grattage et assainit la surface de la peau.", "conseil": "« Si le mal te dévore la peau dès que tu te couches, isole-toi de tes frères. Lave tes linges à l'eau bouillante et frotte ton corps avec la fleur bleue. La propreté est ta seule armure contre cet ennemi invisible qui rampe sous ta chair. »", "relais": "Traitements médicaux spécifiques (Perméthrine ou Ivermectine). Lavage des draps et vêtements à 60°C. Traitement impératif de tout l'entourage.", "vigilance": "La gale ne guérit jamais seule. Un avis médical est obligatoire pour stopper la contagion et recevoir le traitement curatif moderne.", "kw": "démangeaisons parasites peau"}, {"name": "GOUTTE", "subtitle": "Le Mal des Puissants", "desc": "Accumulation d'humeurs brûlantes et épaisses dans les jointures.", "diag": "• Signes : Douleur foudroyante, souvent au gros orteil. Articulation rouge et luisante. • Sensation : Même le poids d'un drap devient insupportable.", "anciens": "Surnommée \"le mal des rois\", elle frappait ceux qui abusaient de viandes rouges et de vins forts. On pensait que des humeurs acides \"tombaient\" (goutte à goutte) dans l'articulation.", "secret": "Le Citron est le grand dissolvant des acides internes. • Le Remède : Jus de citron pur ou dilué. • L'Action : Boire le jus d'un citron plusieurs fois par jour. Alléger la pitance. • L'Effet : Aide le corps à dissoudre les cristaux de \"pierre\" qui blessent la jointure.", "conseil": "« Frère, si ton pied brûle comme si tu marchais sur des charbons ardents, c'est que ta table a été trop généreuse. Délaisse le vin et la viande de bœuf. Refroidis ton membre à la glace et bois l'eau acide du citron pour laver tes péchés de gourmandise. »", "relais": "Boire au moins 2 litres d'eau par jour. Application de glace. Traitements prescrits par le médecin (Colchicine). Régime pauvre en purines.", "vigilance": "Consultez pour toute première crise afin de confirmer le diagnostic et vérifier le taux d'acide urique dans le sang.", "kw": "orteil articulation podagre"}, {"name": "GRIPPE", "subtitle": "Le Fléau de l'Air Corrompu", "desc": "Attaque généralisée des humeurs affaiblissant le corps entier.", "diag": "• Signes : Fièvre brutale, frissons, courbatures intenses, fatigue extrême. • Alerte : Maux de gorge et toux sèche associée.", "anciens": "La grippe était vue comme une \"influence\" de l'air corrompu. Elle s'attaquait aux esprits vitaux, laissant le chevalier plus faible qu'après trois jours de siège.", "secret": "Le bouclier protecteur du campement. • Le Remède : Jus de citron ( Citrus × limon ) chaud, miel généreux et oignon cuit ( Allium cepa ). • L'Action : Boire plusieurs fois par jour. Consommer l'oignon pour purifier l'intérieur. • L'Effet : Soutient le cœur, adoucit la gorge et aide à chasser le mal par la sueur.", "conseil": "« Quand le fléau frappe la troupe, protège ton souffle. Le miel de nos ruches et le citron d'Orient sont tes alliés. Couvre-toi de ton manteau de laine et laisse la fièvre brûler le mal. Le repos est le seul combat que tu dois mener aujourd'hui. »", "relais": "Hydratation constante : eau, tisane de thym ( Thymus ). Paracétamol pour les douleurs. Miel de thym (sauf pour les enfants de moins de 1 an).", "vigilance": "Urgence (15/112) : En cas de difficulté à respirer, de confusion, de douleur thoracique ou si la fièvre ne baisse pas après 3 jours.", "kw": "fièvre refroidissement courbatures"}, {"name": "HÉMORRAGIES", "subtitle": "Le Flux Vital", "desc": "Rupture de l'équilibre du sang s'échappant de son conduit.", "diag": "• Signes : Écoulement sanguin visible (plaie) ou suspecté (pâleur extrême). • Risque : Affaiblissement rapide des forces, évanouissement.", "anciens": "Le sang étant le siège de la vie, son écoulement était perçu comme une fuite de l'âme. Il fallait stopper, refroidir et resserrer les chairs par tous les moyens.", "secret": "Refermer la brèche par la force des éléments. • Le Remède : Résine de pin (colophane) ou compresses serrées. • L'Action : Appliquer une pression ferme et continue sur la plaie. Autrefois, on utilisait même des toiles d'araignée propres pour \"figer\" le sang. • L'Effet : Aide à la coagulation et barre la route au flux.", "conseil": "« Si le fer ennemi a mordu ta chair, ne regarde point la blessure. Appuie ta main ou un linge propre avec toute ta force sur le trou. Ne lève point la main pour voir si cela coule encore, car tu briserais le travail que le sang fait pour se figer. »", "relais": "Compression directe sur la plaie. Pansements hémostatiques. Maintenir la partie blessée surélevée si possible.", "vigilance": "Urgence absolue (15/112) : Si le sang gicle par saccades, si l'hémorragie ne s'arrête pas après 10 minutes de pression ou si la personne devient pâle et confuse.", "kw": "saignements sang plaie"}, {"name": "HÉMORROÏDES", "subtitle": "Le Flux Inférieur", "desc": "Stagnation de sang chaud et enflammé dans les veines basses.", "diag": "• Signes : Douleurs au siège, inflammation locale, saignements légers après la selle. • Sensation : Pesanteur et brûlure constante.", "anciens": "On y voyait une accumulation de sang « mélancolique » ou trop chaud, incapable de remonter vers le cœur, qui finit par gonfler les veines comme un outre trop plein.", "secret": "Le Chêne resserre les conduits tandis que le Bouillon-blanc veloute les chairs. Le Bouillon-blanc aussi appelé « herbe de Saint-Fiacre », en plus de ses bienfaits médicinaux, était largement réputée pour conjurer les malédictions et les mauvais esprits. • Le Remède : Bains de siège à l'écorce de Chêne ou compresses de Bouillon-blanc. • L'Action : Faire frémir une poignée d'écorce de chêne dans un broc d'eau, puis verser tiède en bain de siège. Pour les compresses, infuser les feuilles de bouillon-blanc dans une eau chaude, égoutter et appliquer localement. • L'Effet : Aide à resserrer les tissus, diminue l'irritation et calme la douleur.", "conseil": "« Frère, celui qui reste trop longtemps en selle ou sur le banc de pierre finit par irriter ses chairs. Ne laisse pas le mal s'enraciner. Mange les fibres de la terre pour que ton ventre soit souple, et après chaque chevauchée, baigne-toi à l'eau de chêne pour raffermir tes veines. »", "relais": "Crèmes et onguents protecteurs. Alimentation riche en fibres et hydratation pour éviter la constipation. Bains de siège à l'eau tiède.", "vigilance": "Consultez si les saignements sont abondants, si la douleur devient insupportable (risque de thrombose) ou si une grosseur dure apparaît.", "kw": "fic anus veines"}, {"name": "HYPERTENSION", "subtitle": "La Pression du Sang", "desc": "Excès de chaleur et de force dans les conduits vitaux.", "diag": "• Signes : Maux de tête lancinants, visage très rouge, palpitations cardiaques. • Sensation : Bourdonnements d'oreilles, impression de \"pression\" derrière les yeux.", "anciens": "Attribuée à un excès de sang et de chaleur (« pléthore »), souvent aggravée par les banquets trop riches en viandes et en vins, ou par une colère mal maîtrisée.", "secret": "L'Olivier d'Orient est le grand régulateur du flux du sang ; l'ail, un fortifiant du cœur. • Le Remède : Infusion de feuilles d'olivier et d'aubépine (Crataegus) ; ail frais aux repas. • L'Action : Mettre une petite poignée de feuilles dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire matin et soir en période de fatigue ou de &#x201C;sang trop vif&#x201D;. • L'Effet : Aide à calmer l'ardeur intérieure, soutient la circulation et « assouplit les conduits ».", "conseil": "« Si ton sang frappe à tes tempes comme un bélier contre une porte, délaisse le sel et les viandes fumées. Le calme de l'esprit est ton premier remède. L'olivier, arbre de paix, est là pour apaiser la tempête qui gronde dans tes veines. »", "relais": "Réduction drastique du sel. Gestion du stress et activité physique régulière. Contrôle régulier de la tension chez un médecin.", "vigilance": "Urgence (15/112) : En cas de maux de tête violents soudains, de troubles de la vue, de douleur thoracique ou de confusion.", "kw": "tension artérielle pression"}, {"name": "HYPOTENSION", "subtitle": "Le Flux Faible", "desc": "Insuffisance de chaleur vitale empêchant le sang de nourrir la tête.", "diag": "• Signes : Étourdissements au lever, sensation de tête légère, faiblesse générale. • Sensation : Vision qui se trouble brièvement, fatigue dès le matin.", "anciens": "On y voyait une insuffisance de \"souffle vital\". Le sang, trop lent ou trop froid, ne parvient plus à monter jusqu'au siège de l'esprit.", "secret": "Les toniques de l'aurore pour réveiller le cœur. • Le Remède : Tisane de romarin et cannelle (cannelle frémissante, romarin infusé). • L'Action : Faire frémir un éclat de cannelle dans une tasse d'eau le temps d'un court Pater, puis retirer du feu. Ajouter une pincée de romarin, couvrir et laisser tirer le temps de trois Pater. Boire une tasse à l'aube. • L'Effet : Réchauffe le corps, relance la circulation et redonne du tonus aux esprits.", "conseil": "« Ne te lève point trop brusquement de ta couche si ton esprit vacille. Laisse le temps à ton sang de retrouver son chemin. Le romarin des garrigues est le feu dont ton corps a besoin pour lancer ta journée de service. »", "relais": "Boire suffisamment d'eau tout au long de la journée. Porter des bas de contention si nécessaire. Se lever par étapes.", "vigilance": "Consultez si les malaises sont fréquents, s'ils entraînent des chutes ou s'ils s'accompagnent de pertes de connaissance.", "kw": "tension basse malaise"}, {"name": "IMPÉTIGO", "subtitle": "L'Éruption des Braves", "desc": "Infection chaude et contagieuse de la surface de la peau.", "diag": "• Signes : Croûtes jaunes \"couleur miel\", zones rouges suintantes. • Risque : Très contagieux par simple contact.", "anciens": "Considéré comme une éruption de \"chaleur maligne\". Les humeurs impures cherchent à s'évacuer et corrompent la peau au passage.", "secret": "L'écorce de Chêne ( Quercus ) contient les tanins qui ferment la porte au mal. • Le Remède : Décoction d'écorce ou de feuilles de chêne. • L'Action : Appliquer en compresses tièdes sur les croûtes sans frotter. • L'Effet : Assèche les suintements et aide à la chute des croûtes.", "conseil": "« Si la croûte apparaît sur ton visage ou tes mains, la discrétion est ton armure. Ne partage ni ton linge, ni ton écuelle avec tes frères d'armes. Lave tes mains sans cesse, car le mal voyage sur la peau de celui qui néglige sa propreté. »", "relais": "Nettoyer au savon doux (type Marseille). Utiliser un antiseptique non piquant (Chlorhexidine). Crème antibiotique locale sur avis médical.", "vigilance": "Consultez impérativement en cas de fièvre, si les lésions s'étendent rapidement ou si plusieurs membres de la commanderie sont touchés.", "kw": "croûtes peau enfant infection"}, {"name": "INCONTINENCE", "subtitle": "La Faiblesse de la Vessie", "desc": "Relâchement des forces retenant les eaux.", "diag": "• Signes : Fuites involontaires d'urine, besoin impérieux et soudain. • Sensation : Perte de contrôle, gêne au quotidien.", "anciens": "Vue comme un \"relâchement\" des muscles et des esprits qui gardent la porte de la vessie. Le froid ou l'âge ont affaibli le verrou naturel du corps.", "secret": "Le Cresson ( Nasturtium officinale ) est réputé fortifiant pour les voies urinaires. • Le Remède : Infusion de feuilles de cresson frais (dans de l'eau ou du lait). • L'Action : Boire une tasse matin et soir. • L'Effet : Tonifie la vessie et purifie les conduits.", "conseil": "« Ne laisse point la honte t'envahir si ton corps te trahit. Fortifie ton assise par l'exercice et ne laisse pas ton ventre s'alourdir de viandes trop grasses qui pèsent sur ta vessie. Le cresson des sources claires redonnera de la force à ce qui s'est relâché. »", "relais": "Rééducation du plancher pelvien (kiné). Protections adaptées. Exercices de renforcement.", "vigilance": "Consultez si vous constatez du sang dans les urines, une douleur vive ou si les fuites apparaissent soudainement après un accident.", "kw": "urines fuites vessie"}, {"name": "INFECTIONS URINAIRES", "subtitle": "Le Feu des Conduits", "desc": "Chaleur corrosive brûlant le passage des eaux.", "diag": "• Signes : Brûlures cuisantes à la miction, besoins incessants, urines troubles. • Sensation : Douleur sourde au bas-ventre.", "anciens": "Attribuées à une \"chaleur excessive\" irritant la vessie. Les humeurs brûlent là où elles devraient simplement s'écouler.", "secret": "La Busserole ( Arctostaphylos uva-ursi ) est le \"nettoyeur\" des voies sacrées. • Le Remède : Infusion de feuilles de Busserole. • L'Action : Mettre une petite pincée à une petite poignée de feuilles par tasse, couvrir et laisser infuser. Boire matin et soir sur quelques jours seulement. • L'Effet : Aide à calmer les brûlures urinaires et à &#x201C;purger&#x201D; les humeurs irritantes — autrement dit, peut soutenir le confort urinaire.", "conseil": "« Si le passage de l'eau te brûle comme un tison, ne retiens pas ton flux. Bois l'eau claire des fontaines ou le bouillon de poireau jusqu'à ce que ton intérieur soit lavé. Le mal s'installe dans les eaux stagnantes, ne lui laisse aucun repos. »", "relais": "Boire au moins 2 litres d'eau par jour. Préparations à base de Canneberge (Cranberry, Vaccinium macrocarpon ). La Busserole reste une plante puissante mais qui ne doit pas être utilisée plus d'une semaine sans avis médical.", "vigilance": "Alerte : Si la fièvre apparaît ou si vous avez mal dans le bas du dos (reins), une consultation médicale immédiate est obligatoire. Prudence en cas de maladie rénale, et chez l'enfant.", "kw": "cystite vessie brûlures"}, {"name": "INFLAMMATIONS INTESTINALES", "subtitle": "(L'Ardeur des Entrailles)", "desc": "", "diag": "• Signes : Douleurs abdominales sourdes, diarrhées fréquentes. • Sensation : Sensibilité vive au toucher, impression que le ventre « brûle ».", "anciens": "L'inflammation était perçue comme un excès de chaleur. On pensait que certains aliments « corrompaient » le feu digestif, transformant la transformation des aliments en une agression pour les parois du ventre.", "secret": "Le Fenugrec ( Trigonella foenum-graecum ) apporte une protection onctueuse aux parois irritées. • Le Remède : Infusion légère de graines de fenugrec. • L'Action : Jeter une petite pincée de graines dans une tasse d'eau frémissante, couvrir et laisser tirer le temps d'une courte prière. Boire une à deux tasses par jour. • L'Effet : Apaise le feu des intestins et redonne du corps aux selles.", "conseil": "« Frère, si tes entrailles brûlent, délaisse un temps les chairs épicées et le vin fort. Ton ventre a besoin de la douceur de la terre. Le fenugrec est le baume qui tapisse tes conduits et permet à la force de revenir sans douleur. »", "relais": "Graines de fenugrec en herboristerie. Tisanes digestives apaisantes : Mauve ( Malva sylvestris ), Guimauve( Althaea officinalis ). Probiotiques pour restaurer la flore intestinale.", "vigilance": "Le fenugrec est déconseillé pendant la grossesse (risque de contractions). Consultez si vous avez du sang dans les selles, de la fièvre ou si les douleurs sont insupportables.", "kw": "intestins colite"}, {"name": "INFLAMMATIONS URINAIRES", "subtitle": "(La Douceur des Figues)", "desc": "", "diag": "• Signes : Brûlures lors du passage des eaux, gêne constante.", "anciens": "On croyait que les humeurs étaient devenues si « acides » qu'elles blessaient les parois de la vessie. Il fallait alors un remède doux et nourrissant pour « éteindre » ce feu local.", "secret": "La Figue ( Ficus carica ) était réputée adoucissante pour tous les conduits internes. • Le Remède : Décoction légère de figues dans de l'eau. • L'Action : Consommer les figues fraîches ou sèches et boire leur eau de cuisson. • L'Effet : Adoucit l'évacuation et aide à nettoyer la vessie sans l'irriter.", "conseil": "« Si le passage de l'eau te fait grimacer, adoucis ton sang par les fruits du figuier. C'est un don d'Orient qui calme les ardeurs du bas-ventre. Bois l'eau douce et évite le sel, car le sel est le bois qui nourrit ce feu-là. »", "relais": "Boire abondamment (environ 1,5 à 2 litres d'eau par jour sauf contre-indication médicale). Tisanes apaisantes urinaires. Consommer des figues pour leurs fibres et leur douceur.", "vigilance": "En cas de sang visible, de fièvre ou de douleur dans le dos (reins), une consultation médicale est impérative.", "kw": "vessie urètre"}, {"name": "INSOMNIE", "subtitle": "La Veillée des Esprits", "desc": "Excès de chaleur du cœur et de l'esprit empêchant le repos.", "diag": "• Signes : Difficulté à s'endormir, réveils fréquents, agitation nocturne. • Sensation : Esprit qui galope comme un coursier, fatigue au lever.", "anciens": "L'insomnie était vue comme un feu trop vif dans le cerveau. L'âme, au lieu de se retirer dans le calme de la nuit, restait brûlante d'inquiétude ou de fatigue.", "secret": "Le duo souverain pour éteindre les lumières de l'esprit avant le sommeil. • Le Remède : Infusion de mélisse et de houblon. • L'Action : Jeter une pincée de mélisse et quelques cônes de houblon dans une tasse d'eau frémissante, couvrir et laisser infuser le temps de trois Pater noster. Boire le breuvage peu avant de s'étendre sur la paillasse. • L'Effet : Apaise les pensées agitées, calme le rythme trop vif du cœur et invite l'âme au silence.", "conseil": "« Frère, la nuit est faite pour remettre ton âme à Dieu, non pour ressasser les batailles du jour. Si le sommeil te fuit, bois la fleur de houblon. Garde ta couche loin des courants d'air et du bruit du camp, et laisse la mélisse éteindre le feu de tes pensées. »", "relais": "Tisanes « Sommeil » à base de mélisse. Gélules de Houblon. Associations avec l'Aubépine ( Crataegus ) pour le stress.", "vigilance": "Le houblon est déconseillé en cas d'antécédents de cancers hormonodépendants. Consultez si l'insomnie devient chronique et affecte votre santé mentale.", "kw": "sommeil nuit réveils"}, {"name": "INSUFFISANCE RÉNALE", "subtitle": "La Fatigue des Reins", "desc": "Lassitude profonde des reins, siège des forces vitales.", "diag": "• Signes : Diminution des eaux, gonflements (œdèmes), fatigue extrême.", "anciens": "Les reins étaient perçus comme le filtre de la vie. S'ils se fatiguent, les impuretés stagnent et empoisonnent les autres humeurs, plongeant le chevalier dans une faiblesse généralisée.", "secret": "Le Cresson ( Nasturtium officinale ) est le tonique des eaux par excellence. • Le Remède : Bouillon de cresson (une poignée de feuilles par tasse). • L'Action : Boire 1 à 2 tasses par jour pour favoriser l'élimination. • L'Effet : Stimule en douceur le travail des reins et purifie le sang.", "conseil": "« Si tes jambes gonflent et que ton eau se fait rare, tes reins crient leur lassitude. Ne les charge pas davantage de viandes lourdes ou de sels. Cherche le cresson des ruisseaux clairs : il est le balai qui nettoie ton intérieur et redonne de la force à ton assise. »", "relais": "Cresson frais en alimentation. Compléments alimentaires drainants. Surveillance rigoureuse de la consommation d'eau et de sel.", "vigilance": "Alerte : Une insuffisance rénale est une maladie grave. Si les urines s'arrêtent, si vous êtes confus ou essoufflé, consultez d'urgence.", "kw": "reins urines"}, {"name": "IVRESSE", "subtitle": "Le Brouillard de l'Âme", "desc": "Échauffement excessif du corps et désordre des esprits.", "diag": "• Signes : Désorientation, paroles confuses, perte d'équilibre.", "anciens": "L'ivresse était vue comme un désordre où le vin prenait la place des esprits vitaux. L'âme s'échauffait trop, perdant sa maîtrise sur le corps.", "secret": "Un mélange rustique pour \"éponger\" le mal et ramener la clarté. • Le Remède : Un œuf cru délayé dans une demi-tasse de miel. • L'Action : Faire boire ce mélange à celui qui a trop abusé du tonneau. • L'Effet : Le miel apporte la force tandis que l'œuf calme la brûlure gastrique du vin.", "conseil": "« La tempérance est la première vertu du chevalier. Celui qui se noie dans le vin n'est plus maître de son épée ni de sa langue. Si un frère s'oublie au banquet, donne-lui ce remède de miel pour dissiper les vapeurs du vin avant que la honte ne le submerge. »", "relais": "Hydratation massive (eau). Solutions de réhydratation orale. Boissons sucrées pour éviter l'hypoglycémie.", "vigilance": "En cas de perte de connaissance (coma éthylique) ou de vomissements répétés en étant inconscient : Urgence médicale (15/112).", "kw": "vin alcool lendemain"}, {"name": "JAMBES LOURDES", "subtitle": "Le Pas du Chevalier", "desc": "Stagnation des humeurs dans les membres inférieurs.", "diag": "• Signes : Sensation de pesanteur, gonflement des chevilles le soir. • Sensation : Impression de porter des bottes de fer.", "anciens": "On pensait que le sang et les humeurs « retombaient » dans les jambes par manque de chaleur vitale pour les faire remonter vers le cœur.", "secret": "La Vigne Rouge ( Vitis vinifera ) renforce les conduits pour que le sang remonte. • Le Remède : Infusion de feuilles de vigne rouge et cataplasme d'argile. • L'Action : Boire 2 tasses par jour. Appliquer l'argile froide sur les mollets. • L'Effet : Relance la circulation et dégonfle les tissus.", "conseil": "« Après une journée debout sur les remparts, tes jambes sont ton point faible. Ne les laisse pas s'engorger. La vigne de nos commanderies rend le sang plus vif. Et si la chaleur les fait souffrir, plonge-les dans l'eau fraîche des sources. »", "relais": "Vigne rouge (gélules ou tisanes). Gels « jambes légères ». Port de bas ou chaussettes de contention (essentiel).", "vigilance": "Consultez si une seule jambe gonfle brutalement, devient rouge et chaude (risque de phlébite).", "kw": "circulation veines gonflement"}, {"name": "LOMBALGIES", "subtitle": "Le Dos de la Garde", "desc": "Stagnation d'humeurs froides dans les reins et les lombes.", "diag": "• Signes : Douleurs au bas du dos, raideur empêchant de se redresser.", "anciens": "Le mal de dos était souvent attribué au froid de la nuit ou au port des armures trop lourdes. Le froid figeait les muscles lombaires, bloquant le mouvement des esprits.", "secret": "La moutarde réchauffe la chair en profondeur alors que le romarin libère le mouvement. • Le Remède : Cataplasme tiède de moutarde et infusion de Romarin. • L'Action : Appliquer le cataplasme sur la zone raide pendant un court moment seulement, puis retirer dès que la chaleur devient trop vive. Boire ensuite une tasse d'infusion de romarin. • L'Effet : Attire le sang vers la zone douloureuse pour « fondre » la raideur.", "conseil": "« Le poids du haubert fatigue les reins les plus solides. Si ton dos se bloque, ne reste pas au froid. Cherche la chaleur du feu et laisse la moutarde réveiller ta chair. Un dos souple est nécessaire pour manier la grande épée. »", "relais": "Patchs chauffants. Gels musculaires. Exercices de gainage et maintien d'une activité physique douce.", "vigilance": "La moutarde peut provoquer des brûlures ou de fortes irritations cutanées : ne jamais appliquer sur une peau lésée et interrompre dès sensation excessive de chaleur. Douleur brutale, articulation rouge et très gonflée, ou fièvre : avis médical.", "kw": "reins dos lumbago"}, {"name": "MAL DE DENTS", "subtitle": "La Douleur de l'Ivoire", "desc": "Chaleur enfermée dans l'ivoire de la dent.", "diag": "• Signes : Douleur lancinante, sensibilité extrême, gêne à la mastication.", "anciens": "On croyait à un déséquilibre thermique local. On utilisait parfois des substances précieuses comme le corail en poudre pour renforcer la dent et la \"compote\" pour apaiser.", "secret": "La pomme tiède pour calmer tandis que la poudre de corail entrait autrefois dans certaines poudres destinées à nettoyer et polir les dents. • Le Remède : Compote de pommes tiède appliquée localement. • L'Action : Maintenir la chaleur douce de la compote sur la zone sensible afin d'apaiser les tensions des chairs. • L'Effet : Calme les douleurs superficielles et apporte un soulagement temporaire.", "conseil": "« Si la rage de dent te prend, c'est que l'humeur corrompt l'ivoire. Nettoie tes dents avec un brin de bois et frotte-les avec la poudre de corail pour en chasser les impuretés. Mais n'oublie pas : le clou de girofle demeure ton meilleur bouclier contre la douleur vive. »", "relais": "Huile de clou de girofle ( Syzygium aromaticum ) : une goutte diluée. Bains de bouche antiseptiques. Antalgiques classiques.", "vigilance": "Urgence dentaire : La compote ne remplace pas le dentiste. Consultez en cas d'abcès, de fièvre ou de gonflement de la joue.", "kw": "rage de dent névralgie"}, {"name": "MAL DE GORGE", "subtitle": "L'Épée dans la Nuque", "desc": "Chaleur inflammatoire de la gorge brûlant la déglutition.", "diag": "• Signes : Douleur en avalant, gorge rouge, enrouement.", "anciens": "La gorge était vue comme un conduit étroit où les humeurs chaudes s'accumulent. Il fallait purifier par le thym et velouter par la mauve pour laisser passer l'air et la nourriture.", "secret": "Le Thym pour combattre le mal, la Mauve pour adoucir les chairs irritées. • Le Remède : Infusion de Thym et gargarismes à la Mauve. • L'Action : Jeter une pincée de thym dans une tasse d'eau frémissante et boire le breuvage plusieurs fois dans la journée. Faire doucement bouillir la mauve dans un peu d'eau ou de lait, puis utiliser le liquide tiède en gargarisme. • L'Effet : Aide à apaiser la gorge irritée et réduit la sensation de brûlure.", "conseil": "« Si ta gorge se serre comme si une dague y était plantée, gargarise-toi avec l'argile ou la mauve. Ne force pas ta voix et couvre ton cou d'une laine chaude, car le vent est le complice du mal de gorge. Le thym d'Orient chassera la corruption de ton souffle. »", "relais": "Pastilles à la propolis. Sprays buccaux. Tisanes de Thym au miel et citron.", "vigilance": "Consultez si vous avez de la difficulté à respirer, une forte fièvre prolongée ou si des taches blanches apparaissent sur vos amygdales.", "kw": "angine pharynx enrouement"}, {"name": "MALADIES PULMONAIRES", "subtitle": "(Le Souffle de Brume)", "desc": "", "diag": "• Signes : Essoufflement au moindre effort, toux grasse persistante. • Sensation : Fatigue profonde, impression que les poumons sont « noyés ».", "anciens": "On y voyait une faiblesse pulmonaire chronique où le \"phlegme\" (humeur froide et humide) s'installait durablement, empêchant l'air de nourrir la chaleur du cœur.", "secret": "Le Cresson ( Nasturtium officinale ) est le tonique des conduits respiratoires. • Le Remède : Infusion de feuilles de Cresson ou de Douce-amère (usage historique, Solanum dulcamara ). • L'Action : Boire une tasse matin et soir en cure prolongée. • L'Effet : Aide à expulser les humeurs stagnantes et renforce la paroi des poumons.", "conseil": "« Si ton souffle s'éteint avant que le combat n'ait commencé, cherche le cresson des sources vives. Le mal des poumons demande du temps et de la patience. Éloigne-toi des brumes des marécages et cherche l'air sec des hauteurs pour assécher tes humeurs. »", "relais": "Tisanes pectorales (Thym, Marrube). Sirops naturels. Rééducation respiratoire si besoin.", "vigilance": "Consultez si la toux dure plus de 3 semaines, si vous voyez du sang dans les crachats ou si l'essoufflement vous empêche de rester allongé.", "kw": "poumons poitrine souffle"}, {"name": "MALADIES DE LA PEAU", "subtitle": "L'Impureté des Chairs", "desc": "Manifestation externe d'un déséquilibre profond des humeurs.", "diag": "• Signes : Lésions diverses, démangeaisons, irritations chroniques.", "anciens": "On croyait que lorsque l'intérieur du corps (estomac ou foie) était corrompu, la nature expulsait les poisons vers la surface. La peau n'est que le miroir de ce qui se passe dans les tripes.", "secret": "Le Cresson ( Nasturtium officinale ) pour purifier l'intérieur, la Noix ( Juglans ) pour apaiser l'extérieur. • Le Remède : Infusion de Cresson (dans du lait) et cataplasme de farine de Noix. • L'Action : Boire l'infusion et appliquer la farine de noix sur les zones irritées. • L'Effet : Nettoie le sang et calme la morsure des démangeaisons.", "conseil": "« Ne frotte point ta peau avec des graisses rances si le mal vient de ton ventre. Purifie ton sang avec les herbes vertes et laisse la noix de nos vergers refermer tes plaies. Une peau saine est le signe d'un corps respecté par la tempérance. »", "relais": "Émollients et crèmes hydratantes protectrices. Argile verte en pâte. Crèmes apaisantes au zinc.", "vigilance": "Consultez si les lésions sont suintantes, douloureuses, ou si elles s'accompagnent de fièvre ou de ganglions gonflés.", "kw": "dermatoses éruptions"}, {"name": "MALADIES DES VAISSEAUX", "subtitle": "(La Fatigue Veineuse)", "desc": "", "diag": "• Signes : Mauvaise circulation, veines visibles, sensation de lourdeur. • Sensation : Jambes qui pèsent comme du plomb à la fin du jour.", "anciens": "Attribuées à un relâchement des parois des conduits. Le sang, trop lourd ou manquant de chaleur, s'accumule dans les membres inférieurs au lieu de remonter vers le foyer du cœur.", "secret": "La Vigne Rouge ( Vitis vinifera ) est la plante de la structure et du flux. • Le Remède : Infusion de feuilles de Vigne Rouge. • L'Action : Jeter une petite poignée de feuilles dans une tasse d'eau frémissante, couvrir et laisser tirer le temps d'une courte prière. Boire une tasse deux à trois fois dans la journée. • L'Effet : Resserre les tissus des vaisseaux et aide le sang à vaincre la pesanteur.", "conseil": "« Si tes veines se gonflent comme des rivières en crue, ne reste point immobile. Surélève tes pieds au repos et bois l'infusion de vigne. La marche est ton alliée pour chasser le sang stagnant qui fatigue tes membres. »", "relais": "Gélules ou extraits de vigne rouge. Port de chaussettes de contention (essentiel). Marron d'Inde en complément.", "vigilance": "Consultez d'urgence si une jambe devient rouge, chaude et douloureuse (risque de phlébite) ou en cas d'ulcération.", "kw": "veines artères circulation"}, {"name": "MALADIES DE LA SUEUR", "subtitle": "Le Mal des Pores", "desc": "Élimination désordonnée des humeurs par l'épuisement ou l'infection.", "diag": "• Signes : Irritations dues à la sueur, mauvaises odeurs persistantes, fatigue cutanée.", "anciens": "La sueur était vue comme une évacuation nécessaire, mais son excès ou sa \"corruption\" signalait un corps surmené ou infecté, où les humeurs ne trouvaient plus d'équilibre.", "secret": "La Fraxinelle ( Dictamnus albus ), plante du \"buisson ardent\", pour assainir le corps. • Le Remède : Racine de Fraxinelle en poudre (Usage Historique). • L'Action : Saupoudrer une pincée sur la nourriture. • L'Effet : Était censée réguler les vapeurs internes et assainir les émanations du corps.", "conseil": "« La sueur du combat est noble, mais la sueur qui gâte la peau est signe de désordre. Lave ton corps à l'eau de source et change tes linges souvent. Ne laisse point l'humidité croupir sous ton armure, car elle est le lit de toutes les corruptions. »", "relais": "Lavage régulier au savon pH neutre. Poudres absorbantes naturelles. Usage d'huiles essentielles assainissantes Tea tree ( Melaleuca alternifolia ) sur avis médical.", "vigilance": "Prudence : La Fraxinelle est irritante et phototoxique. Usage aujourd'hui déconseillé, mentionné ici pour le patrimoine historique.", "kw": "transpiration sudation"}, {"name": "MAUVAISE HALEINE", "subtitle": "(La Corruption du Souffle)", "desc": "", "diag": "• Signes : Odeur buccale persistante, souvent associée à une langue chargée.", "anciens": "Considérée comme une \"corruption\" des humeurs digestives. Si l'estomac ne cuit pas bien la pitance, les vapeurs s'élèvent et viennent gâter l'air expiré.", "secret": "Le Lentisque Pistachier ( Pistacia lentiscus ) offre sa résine pour assainir le souffle. • Le Remède : Larmes de résine (mastic) à mâcher. • L'Action : Mâcher une petite bille de résine après chaque repas. • L'Effet : Purifie les gencives et dissipe les odeurs de l'estomac.", "conseil": "« Un frère dont le souffle est corrompu fatigue l'assemblée. Ne laisse pas les restes de viande gâter ta bouche. Mâche le mastic d'Orient ou le persil de nos jardins pour garder ton haleine aussi pure que tes intentions. »", "relais": "Bains de bouche antiseptiques et bonne hygiène dentaire. Nettoyage doux de la langue à l'aide d'un gratte-langue. Utilisation de gommes à mâcher au mastic naturel (Lentisque).", "vigilance": "Une mauvaise haleine persistante peut signaler une carie cachée ou un trouble du foie ou des reins. Consultez un dentiste.", "kw": "halitose bouche"}, {"name": "MAUX D'YEUX", "subtitle": "Le Regard Lassé", "desc": "Fatigue et irritation des esprits visuels.", "diag": "• Signes : Yeux rouges, picotements, larmoiements excessifs. • Sensation : Impression de \"sable\" dans les yeux.", "anciens": "Les yeux étaient vus comme les miroirs de l'esprit vital. La poussière, le soleil ou le manque de sommeil affaiblissent ces esprits, rendant le regard trouble et douloureux.", "secret": "Le Fenouil ( Foeniculum vulgare ) pour la clarté, l'Aubépine ( Crataegus ) pour le calme. • Le Remède : Infusion légère de fenouil et d'aubépine utilisée en compresse. • L'Action : Faire infuser les plantes dans une eau frémissante, laisser tiédir puis imbiber un linge propre. Appliquer les compresses sur les yeux fermés le temps d'une courte prière. • L'Effet : Rafraîchit les paupières fatiguées et aide à calmer les rougeurs légères.", "conseil": "« Après une journée de guet face au soleil d'Orient, tes yeux réclament la paix. Ne les frotte point avec des mains sales. Lave ton visage à l'eau claire de fenouil et cherche l'obscurité pour que tes esprits visuels retrouvent leur force. »", "relais": "Larmes artificielles. Sérum physiologique pour rincer. Compresses oculaires stériles.", "vigilance": "En cas de baisse de vision, de douleur oculaire intense ou de sensibilité insupportable à la lumière, consultez un ophtalmologue d'urgence.", "kw": "yeux vue conjonctivite"}, {"name": "MIGRAINES", "subtitle": "L'Orage sous le Crâne", "desc": "Montée de chaleur brutale et douloureuse vers la tête.", "diag": "• Signes : Douleurs violentes souvent d'un seul côté, sensibilité à la lumière et au bruit.", "anciens": "La migraine était vue comme une \"vapeur chaude\" s'élevant du corps et restant piégée sous la boîte crânienne. Il fallait refroidir l'esprit et calmer le sang.", "secret": "Le duo pour délier les tensions et refroidir la tête. • Le Remède : Infusion de Camomille romaine et compresses de Basilic. • L'Action : Jeter une pincée de camomille dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire le breuvage tiède. Faire ensuite tremper quelques feuilles de basilic dans l'eau tiédie et appliquer les compresses sur le front. • L'Effet : Calme les nerfs et aide à dissiper la douleur pulsatile dans la tête.", "conseil": "« Si ton crâne semble vouloir éclater sous ton heaume, retire-toi dans le silence et l'ombre. Bois la camomille qui apaise et serre un linge froid sur tes tempes. Le mal vient souvent d'un esprit trop échauffé par les soucis ou le bruit des armes. »", "relais": "Tisanes de Camomille. Antalgiques classiques (Paracétamol, Ibuprofène). Repos dans l'obscurité.", "vigilance": "Un mal de tête brutal \"en coup de tonnerre\" ou accompagné de troubles de la parole ou d'une paralysie est une urgence vitale (15/112).", "kw": "maux de tête céphalées"}, {"name": "NÉVRALGIES DENTAIRES", "subtitle": "Le Feu des Nerfs", "desc": "Irritation violente et lancinante des nerfs de la mâchoire.", "diag": "• Signes : Douleur électrique, lancinante, irradiant souvent vers l'oreille.", "anciens": "Attribuées à une \"chaleur maligne\" localisée attaquant les petits conduits nerveux. La douleur est si vive qu'on la pensait causée par un venin invisible.", "secret": "Les épices de feu pour combattre la douleur par leur chaleur et leur force aromatique. • Le Remède : Décoction légère de Clous de girofle et Muscade. • L'Action : Faire frémir quelques clous de girofle avec une faible pincée de muscade, laisser tiédir puis appliquer la préparation avec un linge propre sur la gencive douloureuse. • L'Effet : Endort le nerf et calme l'irradiation de la douleur.", "conseil": "« La douleur dentaire est un ennemi qui ne dort jamais. Si le mal te lance comme un coup d'épieu, mâche le girofle rapporté par nos navires. Il est plus puissant que n'importe quelle prière contre la rage de dent. »", "relais": "Huile de clou de girofle (en usage local prudent). Bains de bouche antiseptiques. Antalgiques.", "vigilance": "La névralgie peut cacher une infection profonde ou une nécrose. Consultez un dentiste sans attendre que le visage ne gonfle.", "kw": "dents douleur nerf"}, {"name": "OSTÉOPOROSE", "subtitle": "La Fatigue de l'Ossature", "desc": "Affaiblissement de la charpente du corps lié à l'âge.", "diag": "• Signes : Fragilité osseuse, douleurs diffuses dans le squelette. • Sensation : Impression que le corps s'affaisse, perte de force dans le maintien.", "anciens": "Considérée comme un épuisement de la « substance solide » du corps. Les forces vitales, trop sollicitées par les labeurs et les ans, ne parviennent plus à nourrir l'ivoire des os, les rendant aussi friables que du vieux bois.", "secret": "L'Ortie ( Urtica dioica ), abondante aux abords des commanderies, était considérée comme l'un des grands fortifiants du sang et de la charpente. Hildegarde de Bingen en vantait les vertus reminéralisantes ; le Macer Floridus la cite parmi les plantes essentielles du jardin des simples. • Le Remède : Potage de jeunes feuilles d'ortie cuites, ou infusion prolongée de feuilles séchées pour en extraire les sels minéraux. • L'Action : Consommée régulièrement, elle apporte au corps fer, calcium, magnésium et silice — les éléments associés à la solidité de la charpente osseuse. • L'Effet : Fortifie le sang, soutient la structure du corps et compense les carences dues aux jeûnes prolongés imposés par la règle templière.", "conseil": "« Frère, ne laisse pas ton corps devenir une ruine avant l'heure. Comme on renforce les fondations d'une forteresse, nourris tes os par les dons de la terre. L'ortie qui pousse au pied de nos murs est un remède que Dieu a mis à notre portée. »", "relais": "Compléments alimentaires à base d'ortie (gélules, teinture mère), disponibles en herboristerie et en pharmacie. Supplémentation en Vitamine D (essentielle pour la fixation du calcium). Produits de reminéralisation.", "vigilance": "L'ostéoporose est une maladie silencieuse. Si vous vous voûtez ou si une fracture survient lors d'un choc léger, un examen médical (ostéodensitométrie) est nécessaire.", "kw": "os fragilité fractures"}, {"name": "OTITES", "subtitle": "Le Feu de l'Ouïe", "desc": "Inflammation chaude de l'oreille interne ou externe.", "diag": "• Signes : Douleur auriculaire vive, sensation d'oreille bouchée, baisse de l'audition. • Alerte : Rougeur locale ou écoulement suspect.", "anciens": "L'otite était souvent attribuée à un coup de froid suivi d'une chaleur brutale, emprisonnant une humeur \"cuisante\" dans le conduit de l'oreille.", "secret": "L'huile d'olive ( Olea europaea ) transporte le feu de l'Ail ( Allium sativum ) pour brûler l'infection. • Le Remède : Huile tiédie dans laquelle avait macéré une gousse d'ail. • L'Action (Usage historique) : Certaines traditions appliquaient quelques gouttes tièdes à l'entrée du conduit auditif ou utilisaient un linge imprégné posé contre l'oreille douloureuse. • L'Effet : Calme la douleur et assainit le conduit auditif.", "conseil": "« Si le mal d'oreille te rend sourd aux ordres, protège ton conduit du vent par un coton propre. N'utilise point de fer pour curer l'oreille. L'ail d'Orient chassera l'inflammation, mais sache que la chaleur d'une pierre enveloppée contre ton oreille est ton premier secours au bivouac. »", "relais": "Antalgiques (Paracétamol). Soins ORL spécifiques. Gouttes auriculaires pharmaceutiques.", "vigilance": "Danger : N'instillez jamais rien si l'oreille coule ou si vous soupçonnez un tympan perforé. En cas de fièvre élevée ou de douleur insupportable, consultez un médecin.", "kw": "oreille douleur"}, {"name": "PALPITATIONS", "subtitle": "Le Cœur en Désarroi", "desc": "Agitation excessive du siège des émotions et de la vie.", "diag": "• Signes : Battements irréguliers ou rapides, anxiété soudaine, essoufflement.", "anciens": "Les palpitations étaient le signe d'un \"cœur effrayé\". Les émotions fortes ou les vapeurs de l'estomac venaient bousculer la demeure de l'âme, troublant son rythme naturel.", "secret": "La Mélisse ( Melissa officinalis ) apporte la paix au cœur tourmenté. • Le Remède : Infusion légère de feuilles de mélisse. • L'Action : Jeter une pincée de feuilles dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire lorsque le cœur &#x201C;s'emballe&#x201D; ou avant le repos de la nuit. • L'Effet : Régule le rythme et dissipe l'oppression dans la poitrine.", "conseil": "« Le cœur du chevalier doit battre pour Dieu, non pour la peur. Si ton sang s'affole, cherche le silence et laisse la mélisse apaiser ton rythme. Évite le vin trop fort et les colères inutiles qui fatiguent ton foyer intérieur. »", "relais": "Tisanes de Mélisse ou extraits fluides. Souvent associée à l'Aubépine pour les troubles du stress.", "vigilance": "Si les palpitations s'accompagnent d'une douleur dans le bras gauche, de sueurs froides ou d'un malaise, appelez immédiatement les secours (15/112).", "kw": "cœur battements"}, {"name": "PARALYSIE", "subtitle": "L'Immobilité des Esprits", "desc": "Interruption brutale de la circulation des forces vitales.", "diag": "• Signes : Perte de mobilité d'un membre ou d'un côté du visage, faiblesse musculaire.", "anciens": "Attribuée à un blocage des \"esprits nerveux\". On pensait que les conduits étaient obstrués par une humeur froide et épaisse, empêchant la volonté de commander aux membres.", "secret": "Parmi les plantes redoutées des pharmacopées médiévales figurait la jusquiame noire (Hyoscyamus niger). Connue pour ses propriétés narcotiques et hallucinatoires, elle entrait parfois dans certaines préparations destinées à calmer la douleur, provoquer le sommeil ou plonger le patient dans une torpeur artificielle. • Note Historique : Au XIIᵉ siècle, l'école de médecine de Salerne décrit l'usage de l'« éponge soporifique », utilisée avant certaines opérations chirurgicales. Nicolaus Praepositus, dans son Antidotarium, rapporte des préparations mêlant plusieurs plantes aux vertus sédatives — jusquiame, mandragore, laitue, lierre ou extraits végétaux — dont les vapeurs ou décoctions étaient destinées à plonger le patient dans une torpeur artificielle. • Attention : La Jusquiame est une plante hautement toxique. Usage strictement proscrit aujourd'hui en raison des risques graves d'intoxication.", "conseil": "« Si le mouvement quitte ton bras ou ta jambe sans que le fer ne t'ait touché, l'âme ne commande plus à la chair. C'est un signe grave. Ne tente point de remède de fortune ; seul le calme et l'attente du médecin prévaudront. »", "relais": "Aucun traitement par les plantes. Rééducation par kinésithérapie après diagnostic médical.", "vigilance": "Une paralysie soudaine est le signe d'un AVC. Ne perdez pas une seconde : appelez le 15 ou le 112. La vitesse de réaction sauve des vies.", "kw": "membre immobilité perclus"}, {"name": "PARASITES", "subtitle": "Les Hôtes Indésirables", "desc": "Êtres indésirables nourris par les désordres du ventre.", "diag": "• Signes : Douleurs abdominales, amaigrissement inexpliqué, fatigue, parfois démangeaisons anales.", "anciens": "On croyait que les parasites naissaient spontanément dans un ventre \"froid\" et encombré d'humeurs gâtées. Il fallait alors les \"chasser\" par des herbes amères ou des racines purifiantes.", "secret": "La Carotte crue ( Daucus carota ) est le remède simple des campements, tandis que la menthe ( Mentha spicata ) soutient l'estomac éprouvé. • Le Remède : Carottes crues râpées à jeun accompagnées d'une infusion de menthe. • L'Action : Consommer les carottes au lever et au soir durant quelques jours, puis boire une tasse de menthe après le repas. • L'Effet : Crée un terrain hostile aux parasites et aide à leur expulsion.", "conseil": "« Le ventre du soldat est souvent le refuge de vers malfaisants si l'eau qu'il boit n'est pas claire ou si sa viande est mal cuite. Mange la racine d'orange (carotte) à l'aurore pour nettoyer tes tripes. Un corps propre à l'intérieur ne craint point les hôtes de l'ombre. »", "relais": "Antiparasitaires classiques (Vermifuges). Hygiène des mains renforcée. Consommation de graines de courge ( Cucurbita ).", "vigilance": "En cas de symptômes persistants ou de segments visibles dans les selles, une analyse est nécessaire pour adapter le traitement (parasitose spécifique).", "kw": "vers poux puces"}, {"name": "PARKINSON", "subtitle": "Le Tremblement des Ans", "desc": "Faiblesse nerveuse profonde liée au déclin des forces.", "diag": "• Signes : Tremblements involontaires des mains, rigidité des membres, lenteur.", "anciens": "Le diagnostic moderne n'existait pas, on parlait de \"tremblements des vieux\". On y voyait un assèchement des humeurs lubrifiantes du cerveau et une fuite des esprits vitaux.", "secret": "Le Romarin ( Rosmarinus officinalis ) pour réveiller les esprits, la Rhodiole ( Rhodiola rosea ) pour l'endurance. • Le Remède : Infusion de Romarin ou extrait de Rhodiole. • L'Action : Boire régulièrement en cure longue. • L'Effet : Soutient les forces nerveuses et aide le corps à lutter contre l'épuisement.", "conseil": "« Si tes mains s'agitent comme les feuilles sous le vent, ne laisse pas la tristesse gagner ton âme. Cherche la vigueur dans le romarin de nos garrigues. Garde ton corps en mouvement, car le fer qui ne travaille pas finit par se figer. »", "relais": "La Rhodiole est aujourd'hui reconnue pour aider contre la fatigue et le stress. Suivi neurologique indispensable pour les traitements spécifiques (L-Dopa).", "vigilance": "La phytothérapie ne remplace pas le traitement de fond. Consultez si les tremblements s'accentuent ou gênent la marche et l'alimentation.", "kw": "tremblements paralysie agitante raideur"}, {"name": "PIQÛRES D'INSECTES", "subtitle": "La Morsure de l'Air", "desc": "Agression extérieure provoquant une réaction des humeurs.", "diag": "• Signes : Rougeur, gonflement local, démangeaison ou douleur vive au point de piqûre.", "anciens": "Considérées comme une injection de \"venin\" extérieur qu'il fallait aussitôt neutraliser par des agents acides ou apaisants pour empêcher la chaleur de gagner le sang.", "secret": "L'acidité du citron neutralise, la Lavande calme. • Le Remède : Jus de citron pur ou décoction de fleurs de Lavande. • L'Action : Appliquer immédiatement en compresses sur la piqûre. • L'Effet : Dissipe le venin superficiel et éteint l'incendie de la peau.", "conseil": "« Sur les bords du Jourdain ou dans les fossés de nos forteresses, les insectes sont des ennemis invisibles. Si la bête te pique, frotte aussitôt la chair avec du citron ou du plantain écrasé. Ne laisse pas l'enflure gagner, car la peau réagit vite au mal. »", "relais": "Lotion ou roll-on apaisant souvent à base de Lavande aspic ( Lavandula latifolia ). Crème antihistaminique en cas de forte réaction. Lotions à la calamine pour calmer les démangeaisons.", "vigilance": "Urgence (15/112) : Si la piqûre se situe dans la bouche/gorge, en cas de difficulté respiratoire, de malaise général ou de gonflement du visage.", "kw": "guêpe abeille moustique morsure"}, {"name": "PSORIASIS", "subtitle": "Les Écailles de la Peau", "desc": "Plaques épaisses et blanches dues à une impureté du sang.", "diag": "• Signes : Plaques rouges couvertes de peaux mortes (desquamation), démangeaisons. • Sensation : Peau qui semble \"trop étroite\", tiraillements.", "anciens": "Le psoriasis était vu comme une \"écorce\" que le corps dresse pour se protéger de ses propres humeurs corrompues. Il s'agit d'un feu interne qui n'arrive pas à s'éteindre et se fige à la surface.", "secret": "La Pensée sauvage ( Viola tricolor ) est la plante de la clarté cutanée. • Le Remède : Tisane de pensée sauvage. • L'Action : Jeter une petite poignée de fleurs et de feuilles dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire une tasse matin, midi et soir durant plusieurs jours. • L'Effet : Purifie le sang et aide la peau à retrouver sa finesse.", "conseil": "« Si ton corps se couvre d'écailles comme un poisson de mer, c'est que ton esprit est aussi agité que ton sang. Cherche la paix dans le jardin des simples et laisse la pensée sauvage laver tes péchés de chair. Un sang pur offre une peau lisse comme le marbre. »", "relais": "Gélules de Pensée sauvage ou d'Huile de Bourrache ( Borago officinalis ). Crèmes émollientes naturelles. Suivi dermatologique pour les traitements de fond.", "vigilance": "Le diagnostic de \"Psoriasis\" est moderne. Consultez si les plaques saignent (signe de la rosée sanglante) ou si les douleurs articulaires s'en mêlent.", "kw": "peau plaques squames"}, {"name": "RÉTENTION URINAIRE", "subtitle": "Le Barrage des Eaux", "desc": "Impossibilité ou difficulté à évacuer les humeurs liquides.", "diag": "• Signes : Sensation de blocage, pesanteur douloureuse au bas-ventre. • Alerte : Envie pressante mais jet faible ou inexistant.", "anciens": "Attribuée à une obstruction physique ou à une \"paresse\" des conduits. Les eaux stagnantes sont un danger car elles finissent par empoisonner le foyer du corps.", "secret": "La Prêle des champs ( Equisetum arvense ) est le \"balai\" des reins et des conduits urinaires. • Le Remède : Infusion légère de prêle. • L'Action : Jeter une petite poignée de tiges sèches dans une tasse d'eau frémissante, couvrir et laisser tirer le temps d'une courte prière. Boire matin et soir, et parfois à midi, durant quelques jours seulement. • L'Effet : Relance le flux et nettoie les sédiments des conduits.", "conseil": "« L'eau doit couler comme la rivière, sans entrave. Si ton barrage est fermé, utilise la prêle pour forcer le passage. Ne laisse pas le mal s'installer, car un homme qui n'évacue plus ses eaux perd vite sa force de combat. »", "relais": "Tisanes diurétiques. Extraits de Bouleau ( Betula ). Hydratation contrôlée.", "vigilance": "Urgence Absolue (15/112) : Si vous êtes dans l'impossibilité totale d'uriner malgré une vessie pleine. C'est le \"globe urinaire\", une urgence médicale.", "kw": "urines vessie blocage"}, {"name": "SAIGNEMENTS DE NEZ", "subtitle": "L'Excès de Chaleur", "desc": "Écoulement du flux vital par les narines.", "diag": "• Signes : Écoulement de sang clair, souvent par une seule narine.", "anciens": "On y voyait une surabondance de sang trop chaud montant vers la tête. La nature ouvrait une soupape pour éviter que le cerveau ne soit frappé par l'apoplexie.", "secret": "L'Ortie ( Urtica dioica ) possède le pouvoir de figer le sang lors des petits saignements. • Le Remède : Compresse ou linge propre imbibé d'une décoction légère d'ortie. • L'Action : Appliquer délicatement à l'entrée de la narine tout en maintenant la tête légèrement penchée vers l'avant. • L'Effet : Resserre les petits vaisseaux et stoppe la fuite.", "conseil": "« Si ton nez coule rouge sous le soleil, ne panique pas. Penche la tête en avant pour laisser couler le mal et pince tes narines fermement. Le sang doit s'arrêter là où il est né. L'ortie séchera la source en un instant. »", "relais": "S'asseoir, pencher la tête en avant et pincer les ailes du nez pendant 10 min. Mèches hémostatiques disponibles en pharmacie.", "vigilance": "Consultez si le saignement dure plus de 20 minutes, s'il est très abondant ou s'il se répète trop souvent.", "kw": "épistaxis nez sang"}, {"name": "SCIATIQUE", "subtitle": "Le Nerf du Croisé", "desc": "Douleur irradiante le long de la jambe, figeant le mouvement.", "diag": "• Signes : Douleur partant du bas du dos et descendant derrière la cuisse. • Sensation : \"Coup de jus\" électrique ou raideur totale.", "anciens": "Attribuée à une stagnation \"froide\" des humeurs venant enserrer le grand nerf de la marche. Le froid des châteaux et le poids des armes en étaient les causes premières.", "secret": "La Moutarde apporte la chaleur là où le froid a figé le nerf. • Le Remède : Cataplasme tiède de moutarde. • L'Action : Appliquer le cataplasme sur le bas du dos durant un court moment seulement, puis retirer dès que la chaleur devient trop vive. • L'Effet : Réchauffe les chairs et libère le nerf de son étreinte.", "conseil": "« Quand le mal descend dans ta jambe comme une lame froide, cherche le feu de la moutarde. Couvre ton dos de laines chaudes et ne reste pas sur la terre humide. Un guerrier doit avoir les reins au chaud pour tenir son rang. »", "relais": "Patchs chauffants. Gels anti-douleur. Repos relatif et marche douce dès que possible.", "vigilance": "Consultez d'urgence en cas de perte de force dans le pied, de fourmillements persistants ou de troubles urinaires associés.", "kw": "nerf jambe dos douleur"}, {"name": "SINUSITE", "subtitle": "Le Poids du Front", "desc": "Accumulation d'humeurs épaisses dans les cavités de la tête.", "diag": "• Signes : Douleur au-dessus des yeux ou sous les pommettes, nez bouché. • Sensation : Tête lourde, douleur augmentant quand on se penche en avant.", "anciens": "On pensait que le cerveau produisait trop de \"pituite\" (humeur froide) qui restait piégée dans les os du visage. Il fallait liquéfier ces humeurs par la vapeur.", "secret": "La Menthe ( Mentha Spicata ) apporte son feu volatil et son parfum pénétrant pour dégager les voies. • Le Remède : Inhalations et tisanes de menthe verte. • L'Action : Verser de l'eau frémissante sur les feuilles de menthe et respirer doucement les vapeurs. Boire ensuite une tasse tiède plusieurs fois dans la journée. • L'Effet : Aide à ouvrir les voies respiratoires et favorise l'expulsion des humeurs encombrantes.", "conseil": "« Si ton front pèse comme une enclume, ne laisse pas le mal s'endurcir. Respire le feu de la menthe pour libérer ton esprit. L'air pur des montagnes est ton meilleur remède contre l'humidité des vallées qui gâte ton nez. »", "relais": "Lavage de nez au sel marin (douche nasale). Sprays nasaux salins. Tisanes de menthe.", "vigilance": "Consultez si la douleur est insupportable, si vous avez une forte fièvre ou si vous avez un gonflement autour de l'œil.", "kw": "nez sinus congestion"}, {"name": "STÉRILITÉ", "subtitle": "Le Désir de Lignée", "desc": "Absence de conception malgré l'union des corps.", "diag": "• Signes : Absence de fruit après de longs mois d'attente.", "anciens": "Souvent attribuée à une \"froideur\" des organes ou à un manque de chaleur vitale. On pensait qu'il fallait réchauffer les entrailles pour qu'elles puissent accueillir la vie.", "secret": "La Sauge ( Salvia officinalis ) est la plante de la vie par excellence ( Salvia vient de \"salvare\", sauver ou guérir). • Le Remède : Infusion légère de feuilles de sauge. • L'Action : Jeter quelques feuilles dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire une tasse matin, midi et soir, en cures brèves. • L'Effet : Équilibre les humeurs féminines et réchauffe le ventre.", "conseil": "« La lignée est le sang de la commanderie. Si la vie ne vient point, cherche la force dans la sauge sacrée. Mais sache que le repos de l'esprit est aussi nécessaire que la santé du corps pour que la semence puisse porter son fruit. »", "relais": "Tisanes de Sauge. Bilan hormonal complet pour les deux partenaires. Vie saine sans excès.", "vigilance": "Ne pas utiliser d'huile essentielle de sauge pure (toxique). La sauge est déconseillée pendant la grossesse une fois celle-ci commencée.", "kw": "fécondité conception"}, {"name": "SURMENAGE", "subtitle": "La Fatigue de l'Esprit", "desc": "Épuisement des forces vitales par un labeur excessif.", "diag": "• Signes : Manque de concentration, irritabilité, fatigue que le sommeil ne répare plus.", "anciens": "Vu comme une \"consommation\" de l'âme. À force de veiller et de s'inquiéter, les esprits vitaux s'épuisent, laissant le corps vide de son moteur.", "secret": "L'Artichaut ( Cynara scolymus ) draine le foie, siège des humeurs amères, de la colère et des lourdeurs du corps. • Le Remède : Décoction légère de feuilles d'artichaut. • L'Action : Faire frémir quelques feuilles dans une écuelle d'eau, puis boire le breuvage matin et soir durant quelques jours. • L'Effet : Allège le corps et clarifie l'esprit.", "conseil": "« Frère, celui qui veut trop porter finit par s'effondrer. Pose ton sac et ton épée. Ton esprit a besoin du silence de la prière et ton corps des herbes qui lavent l'intérieur. Le repos n'est pas une faiblesse, c'est l'entretien de l'arme. »", "relais": "Ampoules de Radis Noir ( Raphanus sativus var. niger ) /Artichaut. Tisanes de Mélisse ( Melissa officinalis ). Repos et retrait des sources de stress.", "vigilance": "Le surmenage (burn-out) peut mener à la dépression. Un accompagnement moral ou médical est indispensable.", "kw": "épuisement fatigue nerveuse"}, {"name": "TOUX", "subtitle": "L'Expulsion du Mal", "desc": "Tentative du corps pour chasser les humeurs encombrant le souffle.", "diag": "• Signes : Quintes de toux, irritation de la gorge, poitrine fatiguée.", "anciens": "La toux est la voix des poumons qui demandent secours. Elle expulse les humeurs corrompues que le froid a condensées dans la poitrine.", "secret": "Le bouclier des guerriers contre les miasmes du froid et les souffles corrompus. • Le Remède : Tisane de Thym et d'Origan adoucie au miel. • L'Action : Jeter une pincée de thym et une pincée d'origan dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire le breuvage chaud plusieurs fois dans la journée, avec une cuillerée de miel. • L'Effet : Combat l'infection et calme l'irritation.", "conseil": "« Ne laisse pas la toux ébranler ta poitrine comme un bélier. Protège ton cou de la bise et bois le thym qui brûle le mal. Le miel de nos ruches adoucira ton passage, laissant ton souffle aussi libre que le vent. »", "relais": "Tisane de Thym. Sirops naturels. Miel de forêt (excellent antiseptique).", "vigilance": "Consultez si la toux persiste plus de deux semaines, si vous avez une forte fièvre ou des sifflements respiratoires.", "kw": "gorge poitrine quinte"}, {"name": "TREMBLEMENTS", "subtitle": "L'Instabilité des Esprits", "desc": "Secousses involontaires marquant une faiblesse des nerfs.", "diag": "• Signes : Agitation musculaire, mains qui tremblent au repos ou à l'effort.", "anciens": "Attribués à une perte de maîtrise des \"esprits nerveux\". On pensait que l'équilibre interne était rompu, laissant les membres s'agiter comme des feuilles sous l'orage.", "secret": "Plante de l'oubli et du calme profond. • Note Historique : Était utilisée autrefois pour figer les mouvements désordonnés. • Attention : Plante Toxique. Mentionnée ici pour l'histoire, son usage est proscrit.", "conseil": "« Si tes mains s'agitent, cherche l'ancrage dans la terre. Garde ton calme et évite les boissons qui échauffent trop le sang. Le tremblement est souvent le signe que le corps est fatigué d'avoir trop lutté. Repose ton âme. »", "relais": "Bilan neurologique complet. Magnésium pour les tremblements liés au stress.", "vigilance": "Le tremblement peut être le signe de maladies graves (Parkinson). Un diagnostic médical est impératif.", "kw": "mains agitation"}, {"name": "TROUBLES AUDITIFS", "subtitle": "Le Silence des Sens", "desc": "Affaiblissement de l'ouïe ou bruits parasites (bourdonnements).", "diag": "• Signes : Baisse d'audition, sifflements dans l'oreille.", "anciens": "On croyait que les « esprits sensoriels » quittaient l'oreille ou qu'un vent parasite y était resté piégé. Il fallait relancer la circulation des esprits vers la tête et raviver le feu vital qui animait les sens.", "secret": "Connu depuis l'Antiquité, le Romarin ( Rosmarinus officinalis ) était recommandé par l'École de Salerne pour « chasser les humeurs mélancoliques et stimuler les esprits de la tête ». • Le Remède : Infusion de sommités fleuries de romarin, ou inhalation légère de ses vapeurs aromatiques. • L'Action : Jeter une pincée de romarin dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire matin et soir durant plusieurs jours ou semaines. Les vapeurs tièdes étaient parfois respirées afin de &#x201C;réveiller&#x201D; les organes des sens. • L'Effet : Stimule la circulation cérébrale, dissipe les « vents parasites » piégés dans l'oreille et ravive la vivacité des sens.", "conseil": "« Celui qui n'entend plus le cri de la sentinelle est en danger. Nourris ton sang pour qu'il parvienne à tes oreilles. Le romarin, que Dieu a planté sur nos rivages, redonnera de la vigueur à tes sens émoussés par les ans et le bruit du fer sur le fer. »", "relais": "Huile essentielle de romarin (à inhaler, diluée). Infusions de romarin disponibles en herboristerie. Magnésium pour les acouphènes liés à la fatigue nerveuse.", "vigilance": "Le romarin est déconseillé aux personnes épileptiques et aux femmes enceintes. Consultez un ORL pour écarter un bouchon de cérumen ou une lésion du tympan avant toute automédication.", "kw": "oreille surdité bourdonnements"}, {"name": "TROUBLES DU DÉSIR", "subtitle": "L'Ardeur Faiblissante", "desc": "Baisse de la force vitale et du feu amoureux.", "diag": "• Signes : Lassitude, manque d'envie, fatigue morale et physique.", "anciens": "On y voyait un affaiblissement des \"forces vitales inférieures\". Le feu sacré semblait s'éteindre par épuisement ou par tristesse de l'âme.", "secret": "La verveine ( Verbena officinalis ) était réputée soutenir l'esprit et combattre la lassitude. Le tribulus ( Tribulus terrestris ) également appelé Croix-de-Malte en raison de la forme épineuse de ses fruits, était associé à la vigueur physique et au renforcement des forces du corps. • Le Remède : Infusion légère de verveine associée à des préparations toniques inspirées des pharmacopées orientales. • L'Action : Jeter une pincée de verveine dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire matin et soir durant une cure brève d'une dizaine de jours. • L'Effet : Réveille l'ardeur du sang et redonne du tonus global.", "conseil": "« La force d'un homme n'est pas seulement dans son bras. Si ton feu intérieur s'étouffe, cherche les racines d'Orient pour rallumer la flamme. Mais n'oublie pas que l'excès de vin et de soucis sont les premiers ennemis du désir. »", "relais": "Le ginseng ( Panax ginseng ) est aujourd'hui utilisé comme plante tonique dans certaines approches complémentaires (gélules). Vie saine, sommeil suffisant et réduction du stress restent essentiels.", "vigilance": "Une baisse de désir peut être le signe d'une fatigue profonde ou d'un trouble hormonal. Consultez si cela s'accompagne d'une tristesse durable.", "kw": "libido vigueur"}, {"name": "TROUBLES DE LA TENSION", "subtitle": "(L'Équilibre du Sang)", "desc": "", "diag": "• Signes : Étourdissements, malaises, sensation de flottement.", "anciens": "Le sang doit couler comme un fleuve tranquille. S'il s'agite ou s'endort, l'équilibre est rompu. On utilisait les herbes de jardin pour \"calibrer\" ce flux.", "secret": "L'Estragon ( Artemisia dracunculus ) pour soutenir l'équilibre des forces et réchauffer les entrailles affaiblies. • Le Remède : Tisane légère d'estragon. • L'Action : Jeter quelques feuilles dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire une tasse par jour, de préférence après le repas. • L'Effet : Aide à réguler les humeurs circulatoires et facilite la digestion.", "conseil": "« Ton sang est ton courant de vie. S'il s'emballe ou s'arrête, ton esprit vacille. Utilise l'estragon pour garder le juste milieu. Mange peu de sel et reste actif, car le mouvement est le premier régulateur de la vie. »", "relais": "Ail ( Allium sativum ) et feuilles d'olivier ( Olea europaea subsp. europaea var. europaea ) pour l'hypertension. Hydratation et romarin ( Salvia rosmarinus ) pour l'hypotension.", "vigilance": "Toute tension déréglée nécessite un suivi médical avec un tensiomètre. Ne changez jamais un traitement médical pour des plantes.", "kw": "tension artérielle"}, {"name": "ULCÈRES CUTANÉS", "subtitle": "La Chair Rongée", "desc": "Lésions qui refusent de se refermer, marque d'une corrosion interne.", "diag": "• Signes : Plaies creusées, persistantes, douloureuses et souvent inflammatoires.", "anciens": "On croyait que des humeurs \"acides\" rongeaient la chair de l'intérieur. Il fallait assécher la source et protéger la plaie de la corruption extérieure.", "secret": "Utilisée autrefois pour calmer la douleur de la chair rongée. • Note Historique : Appliquée en compresses pour anesthésier. • Attention : Toxique. Ne pas utiliser.", "conseil": "« Si la plaie refuse de se clore, c'est que ton sang est gâté. Lave la zone avec l'eau de chêne la plus pure et garde-la couverte. La propreté est le premier remède contre la morsure de l'ulcère. Si le mal gagne, mande le chirurgien. »", "relais": "Soins infirmiers spécialisés (pansements hydrocellulaires). Nettoyage au sérum physiologique.", "vigilance": "Un ulcère qui ne guérit pas peut être le signe de diabète ou d'une mauvaise circulation veineuse. Avis médical impératif.", "kw": "plaie jambe cicatrisation"}, {"name": "VARICES", "subtitle": "Les Cordages des Jambes", "desc": "Stagnation sanguine gonflant les conduits des membres inférieurs.", "diag": "• Signes : Veines apparentes, bleues et tortueuses. Pesanteur des jambes.", "anciens": "Comme des rivières qui débordent de leur lit, les veines gonflent parce que le sang est trop lourd pour remonter. On cherchait à \"resserrer\" la chair par la terre.", "secret": "La terre pour contenir le flux et rafraîchir. • Le Remède : Cataplasme d'argile verte. • L'Action : Appliquer une couche épaisse sur les zones gonflées le soir. • L'Effet : Dégonfle les tissus et soulage la sensation de lourdeur.", "conseil": "« Ne laisse pas tes jambes se transformer en cordages de navire. Surélève-les au repos et utilise la force de l'argile pour contenir ton sang. Le mouvement est ton salut : un chevalier qui ne marche plus voit ses jambes mourir. »", "relais": "Gels à la Vigne rouge. Bas de contention (fondamental). Éviter la chaleur directe sur les jambes.", "vigilance": "Consultez d'urgence si la veine devient dure, rouge et brûlante (Phlébite).", "kw": "veines jambes circulation"}, {"name": "VER SOLITAIRE", "subtitle": "L'Intrus des Entrailles", "desc": "Parasite se nourrissant de la pitance du guerrier.", "diag": "• Signes : Faim insatiable ou dégoût, amaigrissement, segments blancs dans les selles.", "anciens": "On l'appelait « le serpent des tripes ». Il fallait l'empoisonner par l'amertume sans tuer l'homme, pour le forcer à lâcher prise.", "secret": "Les sources médiévales désignent sous le nom d'« absinthe » ou de « santonique » plusieurs espèces du genre Artemisia. La plante vermifuge la plus documentée est l'Armoise maritime ( Artemisia maritima ), connue sous le nom d' herba santonica ou « herbe de Saintonge ». Dioscoride, Pline et Galien la citent unanimement. Elle poussait dans plusieurs zones côtières atlantiques où les Templiers possédaient des commanderies. • Le Remède : Macération de sommités fleuries d'armoise dans de l'eau, préparée la veille. • L'Action : Boire en petites quantités à jeun, selon l'usage décrit par Scribonus Largus. • L'Effet : Son amertume affaiblit le parasite et favorise son expulsion.", "conseil": "« Si tu manges pour deux mais restes maigre comme un clou, un hôte indésirable habite ton ventre. Chasse-le par l'amertume de la santonique, que les Anciens récoltaient sur nos rivages de Saintonge. Prends-en la décoction à jeun et l'intrus lâchera prise. »", "relais": "Traitement antiparasitaire médical (Praziquantel ou Albendazole). Analyse de selles préalable pour identification du parasite.", "vigilance": "Les plantes Artemisia contiennent des principes actifs puissants — la Grande Absinthe notamment de la thuyone, substance neurotoxique à doses élevées. Ne pas prolonger sans avis médical. En cas de suspicion de ténia, consultez un médecin.", "kw": "ténia vers intestin"}, {"name": "VERTIGES", "subtitle": "La Terre qui Vacille", "desc": "Perturbation des esprits de la tête et perte d'équilibre.", "diag": "• Signes : Sensation que tout tourne, perte de stabilité, nausées.", "anciens": "Attribués à un désordre des \"esprits animaux\" dans le cerveau. On pensait que l'âme perdait son ancrage, comme un navire sans ancre dans la tempête.", "secret": "L'Anis vert ( Pimpinella anisum ) pour clarifier les esprits troublés, la Mélisse ( Melissa officinalis ) pour apporter calme et stabilité intérieure. • Le Remède : Infusion d'Anis vert et de Mélisse. • L'Action : Jeter une pincée de chaque plante dans une tasse d'eau frémissante, couvrir et laisser infuser le temps d'une courte prière. Boire après les repas durant quelques jours. • L'Effet : Calme le système nerveux et aide à retrouver l'équilibre.", "conseil": "« Si la terre se dérobe sous tes pas sans que tu n'aies bu de vin, ton esprit est décentré. Assieds-toi, fixe un point à l'horizon et bois l'anis. Le calme reviendra dans ta tête comme le soleil après la brume. »", "relais": "Tisanes d'Anis. Manœuvres vestibulaires chez un kiné ou médecin si le vertige est lié à l'oreille interne.", "vigilance": "Consultez d'urgence en cas de vertige brutal associé à des maux de tête violents ou des troubles de la parole.", "kw": "étourdissements équilibre"}, {"name": "VERRUES", "subtitle": "Le Mal de la Peau", "desc": "Condensation d'humeurs impures s'exprimant à la surface.", "diag": "• Signes : Excroissances dures, souvent sur les mains ou les pieds.", "anciens": "Considérées comme des \"petites pierres\" de chair poussées par un sang mal nettoyé. Il fallait les \"brûler\" par des agents acides naturels.", "secret": "Le duo mordant pour dissoudre l'excroissance de peau. • Le Remède : Compresse de Vinaigre de vin ou gousse d'ail écrasée. • L'Action : Fixer sur la verrue chaque soir sous un linge durant la nuit. • L'Effet : La verrue était censée se dessécher progressivement avant de tomber.", "conseil": "« La verrue est une herbe folle sur ta peau. Brûle-la par l'ail ou le suc de figue, mais prends garde à ne pas blesser la chair saine autour. La patience est ton alliée : le mal a mis du temps à venir, il en mettra pour partir. »", "relais": "Traitements à l'acide salicylique. Cryothérapie (froid). Suc de Chélidoine ( Chelidonium majus ), appelé aussi « herbe aux verrues », avec prudence en usage local.", "vigilance": "Attention au suc de figue, de chélidoine ou à l'ail, qui peuvent provoquer des brûlures cutanées. Protégez toujours la peau saine autour de la verrue avec un corps gras et interrompez l'application en cas d'irritation importante.", "kw": "peau excroissance"}, {"name": "VÉSICULE BILIAIRE", "subtitle": "L'Engorgement amer", "desc": "Excès de bile stagnante provoquant douleurs et nausées.", "diag": "• Signes : Douleurs sous les côtes à droite, digestion pénible des graisses.", "anciens": "La vésicule est le réservoir de l'amertume. Si elle déborde ou se fige, la colère gagne l'esprit et la douleur gagne le flanc. Il faut faire couler la bile.", "secret": "Le grand draineur des humeurs amères. • Le Remède : Décoction de feuilles d'artichaut. • L'Action : Boire une tasse au goût amer avant le repas principal. • L'Effet : Favorise l'écoulement de la bile et aide à alléger les lourdeurs du foie et de la digestion.", "conseil": "« Si ton flanc droit te brûle après la viande, ton chaudron de bile est plein. L'artichaut est ton ami, malgré son goût rude. Il lavera ton intérieur et calmera ton humeur massacrante. »", "relais": "Ampoules de Radis Noir ( Raphanus sativus var. niger ). Tisanes de Fumeterre ( Fumaria ). Limiter les graisses cuites.", "vigilance": "Danger : Ne prenez pas de plantes drainantes si vous suspectez des calculs biliaires (risque de colique hépatique). Consultez en cas de douleur aiguë.", "kw": "bile foie calculs"}, {"name": "VOMISSEMENTS", "subtitle": "Le Rejet de l'Estomac", "desc": "Réaction violente de l'estomac refusant de garder les humeurs.", "diag": "• Signes : Nausées puissantes, rejets gastriques.", "anciens": "L'estomac rejette ce qu'il ne peut pas transformer. C'est un mouvement de défense contre un poison ou une corruption, mais cela affaiblit grandement la chaleur vitale.", "secret": "La résine de Lentisque était réputée « fixer » l'estomac et calmer les entrailles agitées. • Le Remède : Infusion légère de résine ou de feuilles de lentisque. • L'Action : Laisser infuser dans une eau chaude puis boire lentement, par petites gorgées tièdes ou refroidies. • L'Effet : Calme les spasmes et aide l'estomac à retrouver son assise.", "conseil": "« Si ton ventre rend ce qu'il a reçu, ne le force pas. Laisse-le se reposer. Le gingembre ou le lentisque calmeront la tempête. Bo
