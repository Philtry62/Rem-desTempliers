<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Remèdes des Templiers</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remèdes">
<style>

:root {
  --bg: #120800;
  --surface: #1e1000;
  --surface2: #2a1800;
  --accent: #c9a84c;
  --accent2: #e8c878;
  --red: #8b1a1a;
  --text: #f0e6d0;
  --muted: #9a8060;
  --border: #3a2010;
  --green: #4a7a3a;
  --parch: #f5edd8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* HEADER */
header {
  background: linear-gradient(135deg, #0a0400 0%, #1e0e00 50%, #0a0400 100%);
  border-bottom: 2px solid var(--accent);
  padding: 12px 16px 12px;
  padding-top: max(12px, env(safe-area-inset-top));
  height: calc(68px + env(safe-area-inset-top, 0px));
  display: flex; align-items: flex-end; gap: 12px;
  padding-bottom: 10px;
  flex-shrink: 0; z-index: 10; position: relative;
}
.header-icon { font-size: 28px; flex-shrink: 0; }
.header-text h1 { font-size: 15px; color: var(--accent); letter-spacing: 1px; line-height: 1.2; }
.header-text p { font-size: 10px; color: var(--muted); margin-top: 2px; font-style: italic; }
.back-btn {
  margin-left: auto; background: var(--surface2); border: 1px solid var(--border);
  color: var(--accent); padding: 6px 12px; border-radius: 20px; cursor: pointer;
  font-size: 12px; display: none; white-space: nowrap; flex-shrink: 0;
}
.back-btn:hover { background: var(--accent); color: #000; }

/* VIEWS */
#home-view, #chapter-view, #recipe-view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
#home-view { display: flex; }

/* HOME */
.home-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
.home-hero {
  padding: 24px 16px 20px;
  text-align: center;
  background: linear-gradient(180deg, #0a0400 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
}
.home-hero .cross { font-size: 32px; color: var(--accent); text-shadow: 0 0 20px rgba(201,168,76,0.6); }
.home-hero h2 { font-size: 20px; color: var(--accent2); margin: 8px 0 4px; line-height: 1.3; }
.home-hero p { font-size: 12px; color: var(--muted); font-style: italic; }

.search-box { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.search-wrap { position: relative; }
.search-input {
  width: 100%; padding: 9px 14px 9px 38px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 22px; color: var(--text); font-size: 15px; outline: none;
}
.search-input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }

/* NAV PILLS */
.nav-pills {
  display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; -webkit-overflow-scrolling: touch;
}
.nav-pills::-webkit-scrollbar { display: none; }
.nav-pill {
  flex-shrink: 0; padding: 7px 16px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--muted); font-size: 13px; cursor: pointer; font-family: Georgia, serif;
  transition: all .2s;
}
.nav-pill.active { background: var(--accent); color: #0a0400; border-color: var(--accent); font-weight: bold; }
.nav-pill:hover { border-color: var(--accent); color: var(--accent); }

/* CHAPTER CARDS */
.chapters-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  padding: 14px;
}
.chapter-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer; transition: all .2s;
}
.chapter-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.chapter-card-header {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  padding: 14px 10px 12px;
  text-align: center;
  border-radius: 12px;
}
.chapter-card-icon { font-size: 28px; line-height: 1; height: 32px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.chapter-card-title { font-size: 13px; color: var(--accent); margin-top: 8px; font-weight: bold; line-height: 1.3; }
.chapter-card-count { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* RECIPE LIST */
#chapter-view .chapter-header {
  padding: 16px;
  background: linear-gradient(135deg, #0a0400, var(--surface));
  border-bottom: 2px solid var(--accent);
  text-align: center;
}
#chapter-view .chapter-header h2 { font-size: 18px; color: var(--accent); }
#chapter-view .chapter-header p { font-size: 11px; color: var(--muted); margin-top: 4px; font-style: italic; }

.recipe-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); padding: 8px 0; }
.recipe-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.recipe-item:hover, .recipe-item:active { background: var(--surface2); }
.recipe-emoji { font-size: 24px; flex-shrink: 0; }
.recipe-info { flex: 1; }
.recipe-info h3 { font-size: 14px; color: var(--text); line-height: 1.3; }
.recipe-info p { font-size: 11px; color: var(--muted); margin-top: 2px; font-style: italic; }
.recipe-arrow { color: var(--muted); font-size: 14px; }

/* RECIPE DETAIL */
#recipe-view .recipe-header {
  padding: 20px 16px 16px;
  background: linear-gradient(135deg, #0a0400, var(--surface));
  border-bottom: 2px solid var(--accent);
}
#recipe-view .recipe-header h2 { font-size: 20px; color: var(--accent); line-height: 1.3; }
#recipe-view .recipe-header p { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; }

.recipe-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }

.recipe-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; margin-bottom: 12px;
}
.recipe-section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--surface2);
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.recipe-section-header.ingr { border-left: 3px solid var(--accent); }
.recipe-section-header.instr { border-left: 3px solid var(--green); }
.recipe-section-emoji { font-size: 18px; }
.recipe-section-title { font-size: 14px; font-weight: bold; flex: 1; }
.recipe-section-arrow { color: var(--muted); font-size: 11px; transition: transform .2s; }
.recipe-section.open .recipe-section-arrow { transform: rotate(180deg); }
.recipe-section-body {
  padding: 14px; font-size: 13px; line-height: 1.8;
  color: var(--text); display: none; white-space: pre-wrap;
}
.recipe-section.open .recipe-section-body { display: block; }

/* ARTICLE VIEW (history/health) */
.article-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px; background: var(--bg);
}
.article-body p { font-size: 14px; line-height: 1.8; color: var(--text); margin-bottom: 12px; }
.article-body .regle-box {
  background: #f5edd820; border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  border-radius: 4px; padding: 12px 14px; margin: 12px 0;
  font-style: italic; color: var(--accent2); font-size: 13px; line-height: 1.7;
}
.article-body .section-title {
  color: var(--accent); font-size: 15px; font-weight: bold;
  margin: 20px 0 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* HEALTH TIPS */
.tip-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  font-size: 13px; line-height: 1.7; color: var(--text);
}
.health-intro {
  font-size: 14px; line-height: 1.8; color: var(--text);
  padding: 16px; margin-bottom: 8px;
  background: linear-gradient(135deg, #0a0400, var(--surface));
  border-radius: 10px; border: 1px solid var(--border);
  text-align: center; font-style: italic;
}
.health-section {
  color: var(--accent); font-size: 15px; font-weight: bold;
  margin: 22px 0 10px; padding: 8px 0 6px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
}
.health-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  border-radius: 10px; padding: 14px 14px; margin-bottom: 10px;
}
.health-card-title {
  font-size: 14px; font-weight: bold; color: var(--accent2);
  margin-bottom: 4px;
}
.health-card-body {
  font-size: 13px; line-height: 1.6; color: var(--text);
}
.health-good {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  font-size: 13px; line-height: 1.6; color: var(--text);
}
.health-good::before { content: '✅ '; }
.health-bad {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid #8b3a3a;
  border-radius: 10px; padding: 10px 14px; margin-bottom: 6px;
  font-size: 13px; line-height: 1.5; color: var(--muted);
}
.health-bad::before { content: '⛔ '; }
.health-footer {
  text-align: center; font-style: italic; font-size: 13px;
  color: var(--accent); padding: 20px 10px 60px;
  line-height: 1.7;
}

/* MEDICAL BANNER */
#safety-banner {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  background: linear-gradient(135deg, #0a0400, #1e0e00);
  border-top: 2px solid var(--accent);
  padding: 14px 16px 28px;
  font-family: Georgia, serif;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.6);
}
#safety-banner .ban-title { font-size: 13px; font-weight: bold; color: var(--accent); margin-bottom: 4px; }
#safety-banner .ban-text { font-size: 12px; color: #d4b896; line-height: 1.6; }
#safety-banner .ban-btn {
  margin-top: 12px; width: 100%;
  background: var(--accent); color: #0a0400;
  border: none; border-radius: 20px; padding: 9px;
  font-size: 13px; font-weight: bold; font-family: Georgia, serif; cursor: pointer;
}

/* ARTICLE CONTENT (inside chapter-view) */
.article-content {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px; background: var(--bg);
}
.article-content p { font-size: 14px; line-height: 1.8; color: var(--text); margin-bottom: 12px; }
.article-content .regle-box {
  background: #f5edd820; border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  border-radius: 4px; padding: 12px 14px; margin: 12px 0;
  font-style: italic; color: var(--accent2); font-size: 13px; line-height: 1.7;
}
.article-content .section-title {
  color: var(--accent); font-size: 15px; font-weight: bold;
  margin: 20px 0 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.article-content .tip-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  font-size: 13px; line-height: 1.7; color: var(--text);
}

/* RECIPE ITEM NAME & ARROW (chapter recipe list) */
.recipe-item-name { flex: 1; font-size: 14px; color: var(--text); line-height: 1.3; }
.recipe-item-arrow { color: var(--muted); font-size: 18px; flex-shrink: 0; }

/* SEARCH RESULTS */
.search-results { flex: 1; overflow-y: auto; background: var(--bg); }
.search-result-item {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.search-result-item:hover { background: var(--surface2); }
.search-result-item h4 { font-size: 14px; color: var(--text); }
.search-result-item p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.no-results { text-align: center; padding: 40px 20px; color: var(--muted); font-style: italic; }


.hidden { display: none !important; }

/* ── Corrections layout ── */
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: Georgia, serif;
  overflow: hidden;
}
.app-shell {
  display: flex; flex-direction: column;
  height: 100%; height: 100dvh;
}
#index-view {
  display: flex; flex-direction: column;
  flex: 1; overflow: hidden;
}
#disease-list {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 80px;
}
#detail-view {
  display: none; flex-direction: column;
  flex: 1; overflow: hidden;
}
#detail-scroll {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 100px;
}

/* ── Bouton retour en bas ── */
#back-bar {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: linear-gradient(135deg, #1a0a00, #2d1500);
  border-top: 2px solid #c9a84c;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  z-index: 500;
}
#back-bar button {
  width: 100%;
  background: rgba(201,168,76,.15);
  border: 1px solid #c9a84c; color: #c9a84c;
  border-radius: 24px; padding: 11px;
  font-size: 15px; font-family: Georgia, serif; cursor: pointer;
  letter-spacing: .5px;
}
#back-bar button:active { background: rgba(201,168,76,.3); }

/* ── Sections fiche ── */
.disease-header { padding: 16px 0 8px; }
.disease-name   { font-size: 20px; font-weight: bold; color: var(--gold); line-height: 1.3; }
.disease-subtitle { font-size: 14px; color: var(--muted); margin-top: 4px; font-style: italic; }
.disease-desc   { font-size: 13px; color: var(--muted); margin-top: 6px; }
.sections { margin-top: 8px; }
.section { border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
.section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px; cursor: pointer;
  background: rgba(255,255,255,.04); user-select: none;
}
.section-emoji  { font-size: 18px; }
.section-title  { flex: 1; font-size: 14px; font-weight: bold; color: var(--gold); }
.section-arrow  { font-size: 11px; color: var(--muted); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(180deg); }
.section-body   {
  display: none; padding: 10px 14px 14px;
  font-size: 14px; line-height: 1.7; color: var(--text);
  white-space: pre-wrap;
  border-top: 1px solid rgba(201,168,76,.15);
}
.section.open .section-body { display: block; }

.sec-diag     .section-header { background: rgba(30,74,122,.25); }
.sec-anciens  .section-header { background: rgba(139,90,0,.2); }
.sec-anciens  .section-title  { color: #d4a44c; }
.sec-secret   .section-header { background: rgba(45,106,53,.25); }
.sec-secret   .section-title  { color: #7dc98a; }
.sec-conseil  .section-header { background: rgba(107,26,26,.25); border-left: 3px solid var(--gold); }
.sec-conseil  .section-body   { font-style: italic; color: var(--accent); }
.sec-relais   .section-header { background: rgba(26,92,96,.25); }
.sec-relais   .section-title  { color: #5bc4cc; }
.sec-vigilance .section-header { background: rgba(139,32,21,.25); }
.sec-vigilance .section-title  { color: var(--red); }

/* ── Banner avertissement ── */
#safety-banner {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  background: linear-gradient(135deg, #1a0a00, #2d1500);
  border-top: 2px solid #c9a84c;
  padding: 14px 16px;
  font-family: Georgia, serif;
}

/* ── INDEX : entête, compteur, sections par lettre, fiches ── */
.header-title { font-size: 16px; color: var(--accent2); letter-spacing: .6px; line-height: 1.25; }
.header-sub   { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 3px; }

.stats-bar {
  padding: 9px 18px;
  font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.letter-group { padding: 0 0 6px; }
.letter-label {
  display: block;
  margin: 14px 18px 6px;
  padding-bottom: 4px;
  font-size: 13px; font-weight: bold; letter-spacing: 3px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
}
.letter-group:first-child .letter-label { margin-top: 12px; }

.disease-btn {
  display: block; width: 100%;
  padding: 9px 18px;
  background: none; border: none;
  border-bottom: 1px solid rgba(58,32,16,.55);
  color: var(--text); font-family: Georgia, serif;
  font-size: 15px; line-height: 1.3;
  text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.disease-btn:active { background: rgba(201,168,76,.10); }
.disease-btn .d-name { display: block; }
.disease-btn .d-sub  { display: block; font-size: 11.5px; color: var(--muted); font-style: italic; margin-top: 2px; }
.disease-btn.hidden { display: none; }

/* ── Barre alphabétique ── */
#az-bar {
  display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; -webkit-overflow-scrolling: touch;
}
#az-bar::-webkit-scrollbar { display: none; }
#az-bar button {
  flex-shrink: 0; min-width: 30px; padding: 5px 0;
  border-radius: 15px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--accent);
  font-size: 12.5px; font-family: Georgia, serif; cursor: pointer;
}
#az-bar button:active { background: var(--accent); color: #0a0400; }
</style>
</head>
<body>

<div id="safety-banner">
  <div style="font-size:13px; font-weight:bold; color:#c9a84c; margin-bottom:6px;">⚠️ Avertissement médical</div>
  <div style="font-size:12px; color:#d4b896; line-height:1.6;">Ces remèdes sont présentés à titre historique. Ils ne remplacent pas un avis médical. Consultez toujours un médecin.</div>
  <button onclick="document.getElementById('safety-banner').style.display='none'"
    style="margin-top:10px; width:100%; background:#c9a84c; color:#1a0a00;
    border:none; border-radius:20px; padding:9px; font-size:13px;
    font-weight:bold; font-family:Georgia,serif; cursor:pointer;">
    ✓ J'ai compris — Accéder au Grimoire
  </button>
</div>

<div class="app-shell">

  <header>
    <div class="header-icon">✠</div>
    <div class="header-text">
      <div class="header-title">Remèdes des Templiers</div>
      <div class="header-sub">Les Secrets Médicaux du Moyen Âge</div>
    </div>
  </header>

  <!-- Vue liste -->
  <div id="index-view">
    <div class="search-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" class="search-input" placeholder="Chercher une maladie, une plante…"
               oninput="filterDiseases(this.value)">
      </div>
    </div>
    <div id="az-bar"></div>
    <div class="stats-bar" id="stats-bar"></div>
    <div id="disease-list"></div>
    <div class="no-results" id="no-results">Aucune fiche trouvée.</div>
  </div>

  <!-- Vue détail -->
  <div id="detail-view">
    <div id="detail-scroll">
      <div id="detail-content"></div>
    </div>
  </div>

</div>

<!-- Bouton retour — barre fixe en bas -->
<div id="back-bar">
  <button onclick="showIndex()">← Retour à la liste</button>
</div>

<script>
const DISEASES = [{"name": "ABCÈS", "subtitle": "Le Mal Enflammé", "desc": "Accumulation de pus sous la chair, créant une douleur pulsatile.", "diag": "• Signes : Gonflement localisé, rougeur intense, chaleur au toucher. • Douleur : Vive et battante (suit le rythme du cœur). • Risque : Propagation de l'infection si le \"bouton\" n'est pas mûri.", "anciens": "Au Moyen Âge, l'abcès est une tentative du corps pour expulser des humeurs corrompues piégées. Le traitement impose de faire \"mûrir\" le mal pour qu'il s'évacue.", "secret": "La farine de lin ( Linum usitatissimum ) est souveraine pour attirer le pus vers l'extérieur. • Le Remède : Cataplasme de farine de lin ou de mie de pain cuite dans du lait. • L'Action : Appliquer la pâte tiède sous une gaze propre, 1 à 2 fois par jour. • L'Effet : Amollit les tissus et hâte l'ouverture de l'abcès.", "conseil": "« Frère, si la chair s'élève et bat sous ton haubert, ne tente point de percer le mal par le fer froid. Laisse la chaleur du lin attirer l'humeur maligne. Garde la plaie propre par l'eau claire, car un abcès mal vidé est une porte ouverte pour la fièvre de campement. »", "relais": "Appliquer des compresses chaudes de sérum physiologique. Utiliser un antiseptique (Chlorhexidine). L'huile de clou de girofle peut aider localement (avec prudence).", "vigilance": "Un drainage chirurgical est parfois vital. Consultez si la rougeur s'étend, si des traînées rouges apparaissent sur la peau ou si la fièvre survient.", "kw": "furoncle apostume panaris pus"}, {"name": "ABCÈS DENTAIRE", "subtitle": "La Rage de Dent", "desc": "Infection profonde de la gencive ou de la racine.", "diag": "• Signes : Douleur irradiante vers l'oreille ou la tempe, gencive gonflée. • Sensation : Hypersensibilité extrême au chaud et au froid.", "anciens": "On croyait que des humeurs brûlantes étaient piégées dans l'ivoire de la dent. Il fallait apaiser par le froid et désinfecter par le feu des épices.", "secret": "Le clou de girofle ( Eugenia caryophyllata ) est l'anesthésiant des croisés. • Le Remède : Décoction de clous de girofle ou cataplasme de carotte cuite écrasée. • L'Action : Appliquer la carotte tiède contre la dent ou tamponner avec la décoction. • L'Effet : La vitamine A de la carotte apaise, tandis que le girofle foudroie la douleur.", "conseil": "« Si la douleur t'empêche de tenir ton rang, mâche lentement un clou de girofle rapporté d'Orient. Mais sache que le mal vient souvent des restes de viande oubliés entre les dents. Après la pitance, cure tes dents avec un brin de bois propre pour éviter que l'humeur ne se gâte. »", "relais": "Bains de bouche antiseptiques. Une goutte d'huile essentielle de clou de girofle (diluée) sur un coton-tige. Antalgiques (Paracétamol).", "vigilance": "Urgence dentaire impérative si le visage gonfle (joue de \"pape\"), si vous avez du mal à ouvrir la bouche ou si la fièvre apparaît.", "kw": "rage de dent carie gencive"}, {"name": "AÉROPHAGIE", "subtitle": "Le Vent de l'Estomac", "desc": "Accumulation de gaz provoquant ballonnements et inconfort.", "diag": "• Signes : Ventre tendu, éructations, sensation de lourdeur après le repas.", "anciens": "Attribuée à une \"digestion froide\" : l'estomac ne parvient pas à \"cuire\" correctement les aliments, créant des vents corrompus.", "secret": "L'Origan ( Origanum vulgare ) est réputé réchauffer les entrailles et dissiper les vents du ventre. • Le Remède : Infusion d'une pincée de fleurs séchées d'origan. • L'Action : Verser l'eau frémissante sur les fleurs, couvrir et laisser tirer le temps d'une courte prière. Boire une tasse après le repas principal. • L'Effet : Aide à alléger la digestion et à calmer les ballonnements.", "conseil": "« Ne mange point dans la hâte avant la bataille. Celui qui avale de l'air avec sa viande finit le ventre lourd comme un bouclier de plomb. Mâche longuement chaque bouchée, car la digestion commence dans la bouche, non dans les tripes. »", "relais": "Tisanes de menthe poivrée ( Mentha × piperita ) ou charbon végétal (avec précaution car il peut diminuer l'absorption d'autres médicaments). Médicaments à base de Siméticone.", "vigilance": "Consultez si les douleurs sont violentes, si le ventre est dur au toucher ou si vous constatez un arrêt total des gaz et des selles.", "kw": "ballonnements gaz éructations"}, {"name": "AIGREURS D'ESTOMAC", "subtitle": "Le Feu des Entrailles", "desc": "Adoucir le Feu Intérieur — Tempérer l'Acidité.", "diag": "• Signes : Brûlures remontant vers la gorge, douleurs ou aigreurs après les repas. • Sensation : Remontées acides, feu intérieur rongeant les parois de l'estomac.", "anciens": "Selon la théorie des humeurs, un déséquilibre de la bile jaune produisait ces sucs corrosifs qui irritaient les muqueuses. Le traitement ne visait pas à combattre le feu par le feu, mais à l'envelopper et le tempérer par des substances douces, fraîches et mucilagineuses.", "secret": "L'orge (Hordeum vulgare ) et l'avoine ( Avena sativa ) figuraient parmi les premiers remèdes de la pharmacopée contre les troubles gastriques. Hippocrate recommandait l'eau d'orge comme base de tout traitement des fièvres et des inflammations internes. Le recours de base dans tous les hospices monastiques et les commanderies templières. • Le Remède : Bouillir les grains d'orge ou d'avoine pour 1 liquide épais et onctueux. • L'Action : Boire par petites gorgées, à température tiède, avant et après les repas, pour tapisser et protéger les muqueuses gastriques. • L'Effet : Enveloppe les parois de l'estomac d'un film doux et frais, tempère la chaleur excessive des sucs gastriques et apaise l'inflammation.", "conseil": "« Frère, ne laisse pas le feu de tes entrailles consumer ta force avant le combat. Ce qui brûle en toi demande non pas l'eau froide, mais la douceur du gruau. Bois par petites gorgées, et que la fraîcheur de l'orge apaise le feu que l'excès de bile a allumé en toi. »", "relais": "Tisanes de mauve ( Malva sylvestris ) ou de guimauve ( Althaea officinalis ) — mucilages naturels aux propriétés adoucissantes équivalentes, disponibles en herboristerie. Antiacides et alginates (pansements gastriques) en pharmacie.", "vigilance": "Si les brûlures sont quotidiennes, s'accompagnent d'une perte de poids, de difficultés à avaler ou de douleurs nocturnes, un avis médical est indispensable. Un reflux gastro-œsophagien chronique non traité peut entraîner des complications sérieuses.", "kw": "reflux acidité brûlures d'estomac pyrosis"}, {"name": "ALLERGIES", "subtitle": "La Réaction des Humeurs", "desc": "Réaction excessive du corps à son environnement.", "diag": "• Signes : Éternuements, nez coulant, yeux rouges ou plaques sur la peau.", "anciens": "On pensait que le corps tentait d'expulser violemment des humeurs impures par les muqueuses ou l'épiderme.", "secret": "Le duo Ortie ( Urtica sp. ) / Plantain ( Plantago sp. ) est le bouclier naturel contre l'irritation. En soutien, on peut y ajouter du romarin ( Salvia rosmarinus) • Le Remède : Mélange d'ortie, de plantain et romarin. • L'Action : Jeter une grande cuillerée du mélange dans une tasse d'eau frémissante, couvrir et laisser infuser le temps de trois Pater noster. Boire une à deux tasses par jour. • L'Effet : Aide à apaiser les irritations et soutient les défenses naturelles du corps.", "conseil": "« Si la poussière des routes de Terre Sainte fait pleurer tes yeux et brûler ta gorge, ne maudis pas le vent. Purifie ton sang avec l'ortie des fossés. Le mal vient souvent d'un corps trop chargé que le printemps bouscule. »", "relais": "Antihistaminiques. Sprays nasaux à l'eau de mer.", "vigilance": "Urgence vitale en cas de gonflement du visage (Œdème de Quincke), de difficulté à respirer ou de malaise général après un contact allergique.", "kw": "rhume des foins urticaire pollen"}, {"name": "ALZHEIMER", "subtitle": "Le Brouillard de l'Esprit", "desc": "Soutenir la Mémoire — Réchauffer les Esprits du Cerveau.", "diag": "• Signes : Oublis fréquents et confusion, désorientation dans le temps et l'espace. • Sensation : Déclin progressif des fonctions cognitives, esprit qui « s'échappe ».", "anciens": "Les pertes de mémoire et la confusion du grand âge étaient souvent interprétées comme un affaiblissement des esprits vitaux ou un « refroidissement » du cerveau. Certains médecins rattachaient aussi ces troubles à la mélancolie, censée obscurcir les facultés de l'esprit et du souvenir.", "secret": "Surnommé l'« herbe du souvenir », le romarin était réputé soutenir la mémoire et éveiller les esprits. Le Capitulaire De Villis de Charlemagne en imposait la culture dans tous les jardins monastiques. H. de Bingen le citait pour « éclaircir les esprits ». • Le Remède : Infusion de sommités fleuries de romarin, bue matin et soir. • L'Action : Réputé pour « clarifier » les esprits, stimuler la vigilance et réchauffer les humeurs froides du cerveau. • L'Effet : Tonifie la mémoire, dissipe le brouillard mélancolique et ravive le feu vital des facultés intellectuelles.", "conseil": "« Frère, celui dont l'esprit s'égare ne peut plus tenir son rang ni reconnaître son frère d'armes. Bois chaque matin l'infusion de romarin, que nos jardins n'ont jamais cessé de cultiver. Le souvenir est une forteresse — nourris-en les fondations avant que les pierres ne s'effondrent. »", "relais": "Infusions de romarin disponibles en herboristerie. Rhodiole ( Rhodiola rosea ) en extrait sec : plante adaptogène aidant à la résistance mentale et à la gestion du stress cognitif. Oméga-3 pour le maintien des fonctions cérébrales.", "vigilance": "La maladie d'Alzheimer est une pathologie neurologique grave nécessitant un suivi médical strict. Les remèdes naturels ne remplacent en aucun cas les traitements prescrits par un neurologue. Consultez un médecin dès les premiers signes de déclin cognitif — un diagnostic précoce est déterminant pour la prise en charge.", "kw": "démence mémoire oublis brouillard de l'esprit sénilité"}, {"name": "AMPOULES", "subtitle": "Les Cloques du Pèlerin", "desc": "Séparation de l'épiderme due à un frottement mécanique.", "diag": "• Signes : Cloques remplies d'un liquide clair, rougeur périphérique. • Douleur : Vive au moindre contact ou frottement. • Risque : Infection si la peau est arrachée sans précaution.", "anciens": "On y voyait une réaction de défense de la peau : une séparation brutale des humeurs sous l'épiderme provoquée par la répétition d'un choc ou d'une chaleur locale.", "secret": "L'acidité est l'arme des anciens pour tanner la peau et empêcher le mal de s'installer. • Le Remède : Eau vinaigrée ou jus de citron dilué. • L'Action : Nettoyer la zone avec ce mélange. Si l'ampoule est trop gênante, percer avec une aiguille passée à la flamme, mais garder la peau comme protection. • L'Effet : Désinfecte et hâte l'assèchement.", "conseil": "« Frère, sur les routes poussiéreuses vers Jérusalem, tes pieds sont tes meilleurs destriers. Si le cuir de ta botte te mord la chair, n'attends point. Graisse ta peau avant la marche et, au bivouac, laisse tes pieds à l'air libre. Une ampoule ignorée peut faire boiter le plus fier des chevaliers. »", "relais": "Pansements hydrocolloïdes (« seconde peau »). Antiseptiques si la plaie est à vif. Sticks anti-frottement en prévention.", "vigilance": "Consultez si du pus apparaît (liquide trouble), si la rougeur s'étend ou en cas de diabète (cicatrisation difficile).", "kw": "cloques frottement marche"}, {"name": "ANÉMIE", "subtitle": "Le Sang de Glace", "desc": "Appauvrissement de la force vitale circulant dans les veines.", "diag": "• Signes : Fatigue persistante, teint cireux, essoufflement rapide à l'effort. • Sensation : Manque d'énergie globale, impression d'avoir les membres lourds.", "anciens": "L'anémie était perçue comme un sang « froid » et clair, manquant de chaleur vitale pour nourrir les organes et l'esprit.", "secret": "Le vert profond des plantes est le miroir du fer qui manque au sang. • Le Remède : Potage fortifiant (Orties fraîches et carottes) ou infusion d'ortie séchée. • L'Action : Consommer le potage 3 fois par semaine. Ajouter du persil cru en abondance sur chaque écuelle de viande. • L'Effet : Restaure la couleur et la vigueur du flux vital.", "conseil": "« La force d'un Templier ne réside pas seulement dans son bras, mais dans la richesse de son sang. Si ton cœur bat trop vite pour monter en selle, délaisse un temps le pain sec pour les herbes de fer. La terre offre ce dont le sang a besoin pour retrouver son feu. »", "relais": "Supplémentation en Fer, Vitamine B12 et C. Consommation de viande rouge, lentilles et jus de carotte frais.", "vigilance": "Si la fatigue persiste malgré les fortifiants, une analyse de sang est nécessaire pour vérifier le taux d'hémoglobine.", "kw": "pâleur fer sang faiblesse"}, {"name": "ANGOISSE", "subtitle": "L'Esprit en Tourmente", "desc": "Agitation intérieure et chaleur excessive de l'esprit.", "diag": "• Signes : Palpitations cardiaques, agitation, mains moites, pensées envahissantes. • Sensation : Oppression dans la poitrine, peur sans objet défini.", "anciens": "L'angoisse était liée à une « chaleur » au niveau du cœur. L'esprit, trop sollicité par les soucis ou les passions, ne trouvait plus de repos.", "secret": "Surnommée la « plante du cœur tranquille », elle apaise les battements désordonnés et calme l'esprit inquiet. • Le Remède : Infusion de fleurs d'aubépine séchées. • L'Action : Jeter une grande cuillerée de fleurs dans une tasse d'eau frémissante, couvrir et laisser tirer le temps de trois Pater noster. Boire deux à trois tasses dans la journée, dont une avant le repos de la nuit. • L'Effet : Calme le rythme du cœur et apaise l'inquiétude.", "conseil": "« Frère, le tumulte du monde ne doit point briser la paix de ton âme. Si ton cœur galope comme un cheval effrayé, cherche le silence de la chapelle ou l'ombre des grands arbres. Respire longuement la fumée des herbes sacrées et laisse la mélisse ou l'aubépine apaiser tes tempêtes intérieures. »", "relais": "Cures de Magnésium. Exercices de cohérence cardiaque. Tisanes de Passiflore (( Passiflora incarnata ) ou Valériane ( Valeriana officinalis ).", "vigilance": "Une douleur thoracique irradiant vers le bras ou la mâchoire n'est pas de l'angoisse : c'est une urgence vitale (15/112).", "kw": "anxiété stress nervosité inquiétude"}, {"name": "ANOREXIE", "subtitle": "Le Dégoût de la Pitance", "desc": "Perte d'appétit et affaiblissement des forces digestives.", "diag": "• Signes : Amaigrissement rapide, faiblesse musculaire, refus de s'alimenter.", "anciens": "L'absence d'appétit traduisait une « froideur » de l'estomac, devenu incapable d'attirer et de « cuire » les aliments.", "secret": "Les graines de Fenugrec ( Trigonella foenum-graecum ) réchauffent l'estomac et ouvrent la faim. • Le Remède : Infusion légère de graines de fenugrec. • L'Action : Jeter une petite cuillerée de graines dans une tasse d'eau frémissante, couvrir et laisser tirer le temps d'une courte prière. Boire avant le repas principal. • L'Effet : Réveille l'appétit et soutient une digestion plus active.", "conseil": "« Celui qui ne mange point ne peut porter la croix. Si la faim te quitte après de longs mois de campagne, cherche les épices d'Orient. Le fenugrec et la cannelle réveillent l'estomac endormi. Partage ton repas avec tes frères, car la joie du banquet est le premier des stimulants. »", "relais": "Gélules de Fenugrec ou Gentiane ( Gentiana lutea) . Compléments nutritionnels hyperprotéinés sous contrôle médical.", "vigilance": "Le fenugrec est déconseillé pendant la grossesse. Prudence en cas de diabète ou de traitement anticoagulant. Une perte de poids rapide, un refus de s'alimenter, ou une grande faiblesse exigent un bilan médical complet.", "kw": "perte d'appétit inappétence dégoût des aliments"}, {"name": "APHTES", "subtitle": "Le Brûlis de la Bouche", "desc": "Ulcérations blanchâtres très douloureuses dans la bouche.", "diag": "• Signes : Petites taches rondes à centre blanc, douleur vive en mangeant ou parlant.", "anciens": "Les aphtes étaient vus comme un excès de « chaleur interne » cherchant à s'échapper par la muqueuse buccale.", "secret": "L'argile purifie tandis que le citron ( Citrus × limon ) « brûle » l'infection. • Le Remède : Bain de bouche à l'argile verte diluée ou tamponnement au jus de citron. • L'Action : Gargarisme 3 fois par jour après le brossage des dents. • L'Effet : Assainit la bouche et accélère la cicatrisation des chairs.", "conseil": "« Prends garde à ce que tu manges, frère. Si ta bouche se couvre de petites brûlures blanches, c'est que ton ventre crie vengeance. Nettoie tes dents avec une branche de noisetier et rince ta bouche à l'eau claire après chaque pitance. »", "relais": "Gels buccaux protecteurs (filmogènes). Sprays à la propolis. Bains de bouche sans alcool.", "vigilance": "Consultez un dentiste si l'aphte dure plus de trois semaines ou s'il est si douloureux qu'il empêche de s'alimenter.", "kw": "ulcération bouche"}, {"name": "AVC : APOPLEXIE", "subtitle": "L'Urgence Absolue", "desc": "Obstruction soudaine du flux vital vers le cerveau.", "diag": "• Signes : Paralysie d'un côté du corps, visage affaissé, parole confuse. • Alerte : Chute soudaine ou perte d'équilibre inexpliquée.", "anciens": "L'apoplexie était vue comme une obstruction des \"esprits vitaux\" par un excès d'humeurs épaisses figeant le mouvement.", "secret": "Le poivre Cubèbe ( Piper cubeba ) était utilisé pour \"réchauffer le sang\". • Usage Historique : Infusion très légère de cubèbes. • Note : Ce remède est une curiosité patrimoniale ; il ne peut dissoudre un caillot.", "conseil": "« Garde ! Si un frère tombe comme frappé par la foudre, sans qu'aucune lame ne l'ait touché, ne cherche point de remède dans ton sac. C'est l'apoplexie. Allonge-le, garde-le au calme et mande le médecin sans délai. Chaque sablier qui coule est une part de sa vie qui s'envole. »", "relais": "Appelez immédiatement les secours (15 ou 112). Ne donnez ni à boire, ni à manger, ni aucun médicament.", "vigilance": "Le temps, c'est du cerveau. Même si les signes disparaissent après quelques minutes, l'examen hospitalier est obligatoire.", "kw": "attaque cérébrale ictus congestion"}, {"name": "ARTÉRIOSCLÉROSE", "subtitle": "Le Durcissement des Voies", "desc": "Perte de souplesse des vaisseaux sanguins liée à l'âge et aux excès.", "diag": "• Signes : Membres froids, fatigue rapide à la marche, essoufflement.", "anciens": "Considérée comme un durcissement progressif des humeurs à l'intérieur des conduits, figeant la circulation du sang.", "secret": "Le poireau ( Allium ampeloprasum var. porrum ) est le « balai » des artères dans la médecine médiévale. • Le Remède : Bouillon de poireaux longuement mijotés. • L'Action : Boire le bouillon tout au long de la journée et consommer les blancs aux repas. • L'Effet : Aide à fluidifier et à maintenir la souplesse des tissus.", "conseil": "« Comme le fer de l'épée qui rouille s'il n'est point entretenu, tes veines se figent si tu restes assis. Marche chaque jour, même sous la pluie, et évite les graisses trop lourdes qui encrassent ton sang. Le poireau est ton allié pour garder un sang vif jusqu'au soir de ta vie. »", "relais": "Gestion du cholestérol et du poids. Arrêt total du tabac. Alimentation riche en ail ( Allium sativum ) et oignons ( Allium cepa) : P rotecteurs vasculaires.", "vigilance": "Une douleur brutale dans la poitrine ou une faiblesse soudaine d'un bras nécessite un appel immédiat aux secours (15/112).", "kw": "artères cholestérol circulation"}, {"name": "ARTÉRITE", "subtitle": "Le Sang Figé", "desc": "Obstruction froide des voies sanguines dans les membres.", "diag": "• Signes : Crampes douloureuses à la marche, pieds froids au toucher. • Sensation : Lourdeur et faiblesse dans les jambes, peau parfois pâle ou bleutée.", "anciens": "L'artérite était attribuée à une « obstruction froide » des conduits. Le sang, ne pouvant plus circuler librement, laissait les extrémités s'engourdir et mourir de froid.", "secret": "Le Chou ( Brassica oleracea ) est le remède universel pour attirer la chaleur et délier les conduits. • Le Remède : Eau de cuisson de chou vert. • L'Action : Faire blanchir des feuilles dans de l'eau peu salée. Filtrer et boire un verre de l'eau de cuisson tiède. • L'Effet : Relance la vigueur interne et aide au nettoyage des humeurs.", "conseil": "« Si tes jambes te trahissent avant que le soleil ne soit au zénith, ne reste point immobile. Marche, même si le pas est lourd, car l'eau qui stagne croupit, et le sang qui s'arrête se glace. Protège tes pieds du froid humide des fossés par des cuirs gras et de la laine sèche. »", "relais": "Arrêt total du tabac (impératif). Marche quotidienne régulière. Suivi vasculaire pour contrôler la tension et le cholestérol.", "vigilance": "Si un pied devient froid, blanc ou noir, ou si une plaie refuse de cicatriser, consultez en urgence : le risque de gangrène est réel.", "kw": "jambes artères circulation"}, {"name": "ARTHROSE", "subtitle": "L'Usure des Jointures", "desc": "Assèchement des humeurs protectrices entre les os.", "diag": "• Signes : Douleurs articulaires chroniques, raideur au réveil. • Sensation : Grincement ou perte d'amplitude dans les mouvements.", "anciens": "Déjà connue des anciens maîtres, elle était vue comme un assèchement progressif des humeurs lubrifiantes, laissant les os se frotter comme deux pierres sèches.", "secret": "La Reine-des-prés ( Filipendula ulmaria ) est le baume végétal des jointures fatiguées. • Le Remède : Infusion de sommités fleuries séchées. • L'Action : Jeter une petite poignée de fleurs dans une tasse d'eau frémissante — sans forte ébullition — puis couvrir et laisser tirer le temps d'une courte prière. Boire une à deux tasses par jour entre les repas. • L'Effet : Apaise l'inflammation et redonne de la souplesse aux mouvements.", "conseil": "« Frère, l'âge et les lourdes armures finissent par user le corps du plus vaillant. Si tes jointures crient comme les gonds d'une porte rouillée, ne force point. Réchauffe tes membres au feu ou par des frictions de gingembre, et demande à la terre de t'offrir la fleur des prés pour calmer l'incendie. »", "relais": "Gélules de Curcuma ( Curcuma longa ) ou de Gingembre ( Zingiber officinale ) : Anti-inflammatoires naturels. Gels à l'Arnica des montagnes ( Arnica montana ) ou à la Gaulthérie couchée ( Gaultheria procumbens ) pour le massage.", "vigilance": "Attention : La Reine-des-prés contient des dérivés de l'aspirine ( salicylés ). À éviter absolument en cas d'allergie à l'aspirine ou de traitement anticoagulant.", "kw": "articulations usure rhumatismes"}, {"name": "ASTHME", "subtitle": "Le Souffle Court", "desc": "Accumulation de phlegme obstruant les bronches.", "diag": "• Signes : Sifflements à la respiration, oppression de la poitrine. • Alerte : Toux sèche, souvent plus forte la nuit ou après l'effort.", "anciens": "On interprétait l'oppression comme une vapeur épaisse ou un « phlegme » froid qui empêchait l'air pur de nourrir le cœur.", "secret": "Le Bouillon-blanc ( Verbascum thapsus ) est la plante pectorale par excellence des poitrines encombrées et des bronches irritées. • Le Remède : Infusion de bouillon-blanc, de marrube ( Marrubium vulgare ) et d'anis vert ( Pimpinella anisum ). • L'Action : Jeter une pincée de chaque plante dans une tasse d'eau frémissante, couvrir et laisser tirer le temps de trois Pater noster. Filtrer soigneusement puis boire matin et soir durant quelques jours. • L'Effet : Aide à adoucir les bronches et favorise l'expulsion des humeurs épaisses.", "conseil": "« Si l'air vient à te manquer comme si une main de fer serrait ta gorge, éloigne-toi des poussières du foin et des fumées de l'âtre. Respire l'anis pour ouvrir tes voies et garde tes poumons au chaud, car le froid est l'ennemi du souffle. »", "relais": "Traitements de fond inhalés (prescrits par un médecin). Éviter les allergènes. Inhalations douces pour humidifier les muqueuses.", "vigilance": "En cas de crise aiguë où vous ne pouvez plus terminer une phrase sans reprendre votre souffle : Urgence médicale (15/112).", "kw": "souffle oppression respiration"}, {"name": "BOSSES & CHOCS", "subtitle": "Le Sang Captif", "desc": "Stagnation des humeurs provoquée par un choc brutal.", "diag": "• Signes : Gonflement local (\"œuf de pigeon\"), douleur immédiate, bleu à venir.", "anciens": "Le choc fige instantanément les humeurs au point d'impact. Il faut alors \"tirer\" l'épanchement vers l'extérieur pour éviter qu'il ne se corrompe.", "secret": "La terre (l'argile) possède le pouvoir d'absorber la chaleur et le gonflement du choc. • Le Remède : Cataplasme d'argile verte. • L'Action : Appliquer une pâte tiède sur la zone. Renouveler une fois par jour. • L'Effet : Résorbe l'œdème et calme la douleur de l'impact.", "conseil": "« Une chute de cheval ou un coup de bouclier mal paré laisse souvent une marque de bravoure sur le front. Applique la terre froide aussitôt, car elle empêche le sang de se figer et de noircir la chair. Surveille l'enfant qui tombe : s'il s'endort, mande le médecin. »", "relais": "Application immédiate de glace (enveloppée). Gels à l'Arnica ( Arnica montana ). Paracétamol pour la douleur.", "vigilance": "En cas de choc à la tête avec vomissements, somnolence, perte de mémoire ou comportement anormal : Urgence hospitalière immédiate.", "kw": "hématome coup bleu"}, {"name": "BOUTONS", "subtitle": "L'Impureté du Sang", "desc": "Clarifier le Teint — Purifier le Sang.", "diag": "• Signes : Éruptions rouges ou pustules, inflammation cutanée localisée. • Sensation : Peau grasse, irritée, échauffée au toucher.", "anciens": "Manifestation d'une chaleur interne excessive ou d'un sang « impur » cherchant à s'évacuer par les pores de la peau. Selon la théorie des humeurs, un excès de bile jaune ou de sang échauffé provoquait ces éruptions. Il fallait refroidir, purifier et resserrer — à la fois de l'intérieur et de l'extérieur.", "secret": "Le Myrte ( Myrtus communis ) était réputé pour ses vertus astringentes, purifiantes et antiseptiques. Les Templiers en tiraient l'Eau d'Ange — distillat précieux obtenu par macération des fleurs de myrte — considéré comme l'un des remèdes les plus raffinés de la cosmétique médiévale. • Le Remède : Eau d'Ange — distillat de fleurs de myrte appliqué localement. • L'Action : Frictionner doucement les zones touchées matin et soir avec un linge imbibé d'Eau d'Ange. • L'Effet : Purifie l'épiderme, resserre les pores, calme l'inflammation et aide à rééquilibrer les humeurs de la peau.", "conseil": "« Un visage couvert de boutons trahit un sang échauffé et impur. Ne laisse pas la chaleur intérieure consumer ta peau comme la rouille ronge le fer. L'Eau d'Ange, distillée des fleurs de myrte que Dieu a plantées sur nos rivages, purifiera ton épiderme et calmera le feu qui s'y cache. »", "relais": "Hydrolat de myrte ou de lavande ( Lavandula ), disponibles en herboristerie et en pharmacie. Soins locaux à base de zinc. Lotions purifiantes antiseptiques.", "vigilance": "En cas de boutons purulents, douloureux, s'étendant rapidement ou laissant des cicatrices, consultez un dermatologue. Une acné sévère ou un impétigo nécessitent un traitement médical adapté.", "kw": "acné peau"}, {"name": "BRONCHITE", "subtitle": "L'Encombrement des Poumons", "desc": "Accumulation d'humeurs froides et épaisses dans la poitrine.", "diag": "• Signes : Toux grasse avec crachats, douleur derrière le sternum, fatigue.", "anciens": "La bronchite était vue comme une \"froideur\" ayant envahi les poumons, transformant le souffle vital en une substance gluante et encombrante.", "secret": "La moutarde ( Sinapis alba ) est un remède \"révulsif\" qui attire le sang vers la surface pour dégager les profondeurs de la poitrine. • Le Remède : Cataplasme de farine de moutarde et de lin ( Linum ). • L'Action : ¼ de moutarde / ¾ de lin. Appliquer sur la poitrine « le temps de réciter trois Pater ». • L'Effet : Réchauffe puissamment les bronches et aide à l'expectoration.", "conseil": "« Si tes bronches sifflent comme un vent d'hiver dans une fente de muraille, brûle le mal par la moutarde. Mais prends garde, car si la peau rougit trop, le remède devient poison. Ne laisse point le cataplasme plus qu'il n'en faut pour un Pater Noster. »", "relais": "Hydratation abondante (eau, tisane de thym). Miel et citron ( Citrus × limon ) pour apaiser. Sirop naturel au lierre ( Hedera helix ) ou au thym ( Thymus ).", "vigilance": "Si la fièvre dépasse 39°C, si les crachats sont teintés de sang ou si l'essoufflement devient permanent, un avis médical est vital.", "kw": "toux grasse poitrine bronches"}, {"name": "BRÛLURES", "subtitle": "L'Outrage du Feu", "desc": "Excès brutal de chaleur détruisant la surface de la peau.", "diag": "• Signes : Rougeur vive, douleur cuisante, apparition possible de cloques (ampoules).", "anciens": "La brûlure est une intrusion de l'élément Feu dans la chair. Il faut \"éteindre\" l'incendie par des plantes froides et humides pour restaurer l'équilibre.", "secret": "Les plantes d'eau calment l'ardeur du feu. • Le Remède : Feuilles de laitue cuites à l'eau ou carotte crue râpée. • L'Action : Appliquer en cataplasme sur la rougeur. • L'Effet : Rafraîchit instantanément et empêche la formation de la cloque.", "conseil": "« Que ce soit par l'huile bouillante des remparts ou le feu du bivouac, la brûlure est une plaie traîtresse. Refroidis la chair aussitôt à l'eau claire des fontaines. Ne perce point la cloque, car elle est le bouclier que la nature dresse contre la corruption du dehors. »", "relais": "Refroidir sous l'eau fraîche pendant 1 ¼ d'heure. Gel d'Aloe Vera pur (uniquement sur peau non lésée). Pansement gras pour protéger.", "vigilance": "Toute brûlure étendue (plus grande que la paume), profonde (peau blanche ou noire) ou touchant le visage, les mains ou les yeux nécessite une consultation d'urgence.", "kw": "feu échaudure"}, {"name": "CALCULS URINAIRES", "subtitle": "La Pierre des Reins", "desc": "Concrétion d'humeurs épaisses formant des graviers dans les reins.", "diag": "• Signes : Douleurs lancinantes dans les reins, irradiant vers le bas-ventre. • Sensation : Pesanteur constante, difficultés à évacuer les eaux. • Risque : Blocage total des voies urinaires.", "anciens": "On croyait que les sédiments de la nourriture, mal cuits par un estomac trop froid, s'accumulaient dans les reins pour y former de la pierre, telle du calcaire au fond d'un chaudron.", "secret": "L'huile de Noisette ( Corylus avellana ) est réputée pour \"glisser\" et déloger les impuretés. • Le Remède : Huile de noisette pure et eau de cuisson de chou vert ( Brassica oleracea ). • L'Action : Au point du jour, avant toute pitance, avaler deux petites cuillerées d'huile. Boire l'eau de chou tiède dans la journée. • L'Effet : Favorise le passage des pierres et draine les conduits.", "conseil": "« Frère, si la pierre te fait plier en deux comme un vieillard, bois l'eau des sources claires plus que de raison. La stagnation est la mère de la pierre. Marche longuement et secoue ton corps par l'exercice, car le mouvement aide la nature à chasser ce qui l'encombre. »", "relais": "Hydratation massive (2 litres par jour). Tisanes de Piloselle ( Pilosella officinarum ) ou de Reine-des-prés ( Filipendula ulmaria ). Médicaments antispasmodiques sur avis médical.", "vigilance": "Si la douleur devient insoutenable, si vous voyez du sang dans les urines ou si vous ne pouvez plus uriner du tout, il s'agit d'une urgence absolue (15/112).", "kw": "pierres graviers reins"}, {"name": "CATARACTE", "subtitle": "Le Voile du Regard", "desc": "Opacité progressive obscurcissant la clarté du cristallin.", "diag": "• Signes : Vision embrumée, reflet grisâtre au centre de la pupille. • Sensation : Sensibilité accrue à la lumière vive (éblouissement).", "anciens": "Les médecins médiévaux y voyaient une « vapeur épaisse » ou une humeur froide s'étant figée derrière la pupille, empêchant les esprits visuels de percevoir le monde.", "secret": "La Mauve ( Malva sylvestris ) est la plante de la douceur, utilisée pour apaiser les yeux fatigués. • Le Remède : Décoction de fleurs de mauve. • L'Action : Appliquer des compresses imbibées sur les yeux fermés. Boire également en infusion. • L'Effet : Hydrate et calme l'inflammation des tissus entourant le regard.", "conseil": "« Le regard est la fenêtre de l'âme. Si un voile de brume s'installe sur tes yeux, protège-les des poussières de la plaine et du soleil trop ardent. Ne laisse point le mal progresser sans laver ton visage à l'eau de mauve, car la clarté est le premier don du chevalier. »", "relais": "Larmes artificielles et sérum physiologique pour le confort. Port de lunettes de soleil pour protéger le cristallin.", "vigilance": "Sachez-le : Aujourd'hui, seule la chirurgie peut guérir une cataracte installée. Consultez en urgence si la vision baisse brutalement ou si l'œil devient douloureux.", "kw": "vue œil voile"}, {"name": "COLIQUES", "subtitle": "Les Torsions des Tripes", "desc": "Spasmes et contractions douloureuses des muscles intestinaux.", "diag": "• Signes : Crampes brutales au ventre, ventre tendu et gonflé (gaz). • Sensation : Besoin de se plier en deux pour calmer la douleur.", "anciens": "Les coliques étaient vues comme une « bataille de vents » emprisonnés dans les entrailles, souvent provoquée par une nourriture trop froide ou mal mastiquée.", "secret": "Le Fenouil ( Foeniculum vulgare ) est le maître des vents ; il dénoue ce que le froid a figé. • Le Remède : Infusion de graines de fenouil broyées. • L'Action : Mettre une petite cuillerée de graines dans une tasse d'eau frémissante, couvrir et laisser tirer le temps de réciter trois Pater noster. Boire chaud après le repas. • L'Effet : Aide à dissiper les gaz et à délier les tensions du ventre.", "conseil": "« Si tes entrailles se tordent comme des cordages sous l'orage, réchauffe ton ventre par une pierre chaude enveloppée de linge. Mange tes herbes cuites et non crues, et évite les boissons glacées qui figent la digestion. Un ventre calme fait un esprit serein pour la garde. »", "relais": "Charbon végétal pour les gaz. Antispasmodiques classiques. Tisanes d'Anis vert ( Pimpinella anisum ) ou de Carvi ( Carum carvi ).", "vigilance": "Consultez sans tarder si vous avez de la fièvre, des vomissements répétés ou si vous ne parvenez plus à émettre de gaz (risque d'occlusion).", "kw": "ventre crampes intestinales"}, {"name": "COLIQUES NÉPHRÉTIQUES", "subtitle": "(La Foudre des Reins)", "desc": "", "diag": "• Signes : Douleur foudroyante dans le dos, irradiant vers le bas. • Alerte : Impossibilité de rester en place, agitation extrême.", "anciens": "Considérées comme une « obstruction violente » où le corps lutte pour expulser une pierre corrosive. La douleur était si forte qu'on la comparait à un coup de poignard interne.", "secret": "La noix de Muscade ( Myristica fragrans ) était l'épice précieuse pour délier les tissus. • Le Remède : Une pincée de muscade râpée dans une infusion chaude. • L'Action : Boire par petites gorgées avec une hydratation abondante. • L'Effet : Aide à relâcher les conduits pour laisser passer l'intrus.", "conseil": "« Si le mal te frappe les reins au point de te faire mordre la poussière, ne lutte pas contre le mouvement. Marche, saute, agite ton corps pour aider la pierre à trouver son issue. Bois l'eau jusqu'à plus soif pour pousser le mal hors de tes frontières. »", "relais": "Anti-inflammatoires (AINS) pour réduire l'œdème du conduit. Filtrer les urines pour récupérer le calcul.", "vigilance": "Danger : La muscade est toxique à haute dose (max 4g). Si vous avez de la fièvre ou si vous ne pouvez plus uriner malgré l'envie, appelez immédiatement les secours (15/112).", "kw": "reins pierres douleur lombaire"}, {"name": "CONSTIPATION", "subtitle": "L'Entrave des Entrailles", "desc": "Ralentissement du transit et sécheresse des humeurs intestinales.", "diag": "• Signes : Moins de trois selles par semaine, sensation de pesanteur. • Sensation : Ventre dur, inconfort permanent.", "anciens": "Attribuée à une « sécheresse » excessive des intestins. Sans humidité, les restes de nourriture se figent et bloquent le passage, empêchant le corps de se purifier.", "secret": "La Guimauve ( Althaea officinalis ) est la plante « émolliente » qui lubrifie et adoucit. • Le Remède : Infusion de racines ou de fleurs de guimauve. • L'Action : Faire macérer les racines à froid ou infuser les fleurs. Boire 2 tasses par jour. • L'Effet : Humidifie les entrailles et facilite l'évacuation sans irriter.", "conseil": "« Un corps qui ne se libère point est un corps qui s'empoisonne. Ne mange pas ton pain trop sec et ajoute à tes plats l'huile de noisette ou les légumes verts. La marche est le premier des remèdes : un chevalier qui galope ne craint point la paresse de son ventre. »", "relais": "Augmenter les fibres (légumes, son, pruneaux) et l'eau (1,5L). Laxatifs doux sur conseil du pharmacien. Exercice physique régulier.", "vigilance": "Consultez si la constipation s'accompagne de sang, de vomissements ou si vous ressentez une douleur abdominale brutale et intense.", "kw": "transit intestin paresseux"}, {"name": "CONTUSIONS", "subtitle": "L'Ombre du Choc", "desc": "Stagnation du sang sous la chair après un coup ou une chute.", "diag": "• Signes : Douleur vive au point d'impact, apparition d'un hématome (bleu ou violet). • Sensation : Sensibilité locale, gonflement de la zone touchée.", "anciens": "La contusion était vue comme un sang « mort » ou stagnant. Le choc ayant brisé le flux naturel des humeurs, il fallait réchauffer et drainer pour éviter que la zone ne se corrompe.", "secret": "Le Persil frais ( Petroselinum crispum ) et la Consoude ( Symphytum officinale ) sont les maîtres de la réparation des chairs. • Le Remède : Cataplasme de persil bouilli ou de racine de consoude. • L'Action : Appliquer les feuilles de persil encore tièdes ou la pâte de consoude sur le bleu. • L'Effet : Dissout le sang figé et calme la morsure de la douleur.", "conseil": "« Frère, un coup de plat de dague ou une chute de cheval laisse souvent une marque sombre sur ton corps. Ne laisse pas le sang s'endormir sous ta peau. Si tu n'as point de consoude, la glace des torrents ou le fer froid de ta hache peuvent calmer l'incendie avant que l'ombre ne s'installe. »", "relais": "Gels à l'Arnica. Application immédiate d'une poche de glace (enveloppée). Baumes à la consoude sur peau intacte.", "vigilance": "Important : Jamais de consoude sur une plaie ouverte. Consultez si le gonflement est disproportionné ou si le \"bleu\" s'étend de manière inquiétante.", "kw": "coups bleus meurtrissures"}, {"name": "CONVULSIONS", "subtitle": "La Tempête des Esprits", "desc": "Perturbation brutale des forces vitales, souvent chez l'enfant.", "diag": "• Signes : Secousses saccadées, raideur totale ou relâchement, regard fixe. • Alerte : Perte de connaissance brève, cris ou pleurs inhabituels.", "anciens": "On croyait à un désordre violent des « esprits vitaux » provoqué par une fièvre trop ardente ou une influence maligne agitant le cerveau.", "secret": "Le Muguet ( Convallaria majalis ) était utilisé autrefois en eau distillée pour \"fixer\" les esprits. • Usage Historique : Eau distillée de fleurs de muguet. • Note : Ce remède est une curiosité patrimoniale. Le muguet est hautement toxique.", "conseil": "« Si l'enfant est saisi par le mal et s'agite sans raison, ne tente point de le retenir par la force. Éloigne les fers et les bois durs pour qu'il ne se blesse point. Ne mets rien dans sa bouche, car l'esprit doit retrouver son chemin seul. Prie et attends que le calme revienne. »", "relais": "Allonger la personne sur le côté (PLS) après la crise. Protéger la tête. Noter la durée de la crise.", "vigilance": "Urgence vitale (15/112) : Si la crise dure plus de 5 minutes, si c'est la première fois, ou si la personne a du mal à respirer au réveil.", "kw": "spasmes crises"}, {"name": "COURBATURES", "subtitle": "La Fatigue des Braves", "desc": "Douleurs musculaires diffuses après un effort de guerre ou de marche.", "diag": "• Signes : Douleurs dans tout le corps, raideur le lendemain d'un grand effort.", "anciens": "La courbature résultait d'une fatigue des fibres et d'une accumulation d'humeurs \"mélancoliques\" (froides et sèches) dans les muscles trop sollicités.", "secret": "La Cannelle de Ceylan ( Cinnamomum verum ) apporte le feu nécessaire pour chasser le froid musculaire. • Le Remède : Décoction légère de cannelle en bâtons. • L'Action : Mettre un petit bâton (ou deux petits éclats) dans une écuelle d'eau. Porter à frémissement le temps d'un court Pater, puis couvrir et laisser reposer le temps de trois Pater. Boire deux écuelles par jour, de préférence chaud. • L'Effet : Réchauffe le corps de l'intérieur et dénoue les fibres contractées.", "conseil": "« Après une journée de siège sous la pluie, ton corps est comme un arc trop tendu. Cherche la chaleur d'un bain ou frotte tes membres avec du romarin. La cannelle, rapportée de nos comptoirs d'Orient, rendra la souplesse à ton bras pour le combat de demain. »", "relais": "Bain chaud, bouillotte. Bonne hydratation. Huiles de massage au Romarin ( Salvia rosmarinus ) ou à la Gaulthérie couchée ( Gaultheria procumbens ).", "vigilance": "Prudence avec la cannelle si vous prenez des anticoagulants. Consultez si les douleurs s'accompagnent d'urines très sombres (brunâtres).", "kw": "muscles fatigue effort"}, {"name": "CRAMPES", "subtitle": "Le Nœud de la Chair", "desc": "Contraction soudaine et involontaire d'un muscle.", "diag": "• Signes : Douleur vive, muscle dur comme de la pierre, apparition brutale.", "anciens": "Attribuées à un refroidissement soudain ou à un manque d'humidité dans le muscle. La chair \"se rétracte\" sur elle-même par manque de souplesse.", "secret": "Ce duo réchauffe et relâche instantanément les tissus noués. • Le Remède : Infusion de graines de fenouil et de cannelle. • L'Action : Une tasse chaude dès l'apparition du spasme. • L'Effet : Redonne du mouvement et dissipe la douleur.", "conseil": "« Si ton mollet se noue pendant la garde nocturne, étire ta jambe vers le ciel et tire la pointe de ton pied vers toi. La crampe est souvent le signe que l'eau manque à ton corps. Bois aux fontaines avant que la soif ne te prenne. »", "relais": "Boire des eaux riches en Magnésium. Étirements doux. Massage avec une huile à l'Arnica.", "vigilance": "Si les crampes sont fréquentes, nocturnes et empêchent le repos, un bilan médical est nécessaire pour vérifier vos sels minéraux.", "kw": "spasmes muscles"}, {"name": "CRISES DE FOIE", "subtitle": "L'Engorgement Bilieux", "desc": "Lourdeur et nausées dues à un excès ou une mauvaise digestion.", "diag": "• Signes : Envie de vomir, dégoût pour la nourriture, douleur sous les côtes droites.", "anciens": "Le foie était vu comme le \"cuisinier\" du corps. S'il reçoit trop de graisses ou de vins, il s'engorge et ne peut plus transformer les humeurs, créant un reflux biliaire amer.", "secret": "L'Oignon ( Allium cepa ) est le grand purificateur des cuisines médiévales. • Le Remède : Oignon cru ou cuit (à l'eau, à la vapeur). • L'Action : Le consommer simplement, sans excès de graisse, dans les jours où l'estomac est lourd. • L'Effet : Favorise l'écoulement de la bile et libère l'estomac.", "conseil": "« Les banquets trop riches sont plus dangereux que les flèches sarrasines. Si ton teint devient jaune et ton cœur lourd, délaisse la viande grasse. Une bouillotte chaude sur ton flanc droit aidera ton foie à retrouver sa paix. »", "relais": "Duo Radis Noir ( Raphanus sativus var. niger ) / Artichaut ( Cynara cardunculus var. scolymus ) en ampoules. Tisanes de Menthe poivrée ( Mentha × piperita ). Application d'une source de chaleur sur le foie.", "vigilance": "Consultez d'urgence en cas de douleur violente \"en ceinture\", de jaunisse (yeux jaunes) ou de fièvre associée.", "kw": "digestion bile nausées"}, {"name": "CYSTITE", "subtitle": "L'Ardeur d'en Bas", "desc": "Brûlures et gêne lors de l'évacuation des eaux.", "diag": "• Signes : Envie fréquente d'uriner, brûlure cuisante, douleurs au bas-ventre.", "anciens": "La cystite était perçue comme une \"chaleur corrosive\" de la vessie. Le feu s'est installé là où l'eau devrait couler claire.", "secret": "Le Poireau ( Allium ampeloprasum var. porrum ) est le grand draineur des conduits inférieurs. • Le Remède : Bouillon clair de blancs de poireaux. • L'Action : Faire frémir plusieurs poireaux, puis filtrer. Boire le bouillon tiède par petites prises tout au long du jour. • L'Effet : Réputé &#x201C;adoucir&#x201D; et favoriser l'écoulement des urines, utile quand la vessie est irritée ou que l'urine &#x201C;brûle&#x201D;.", "conseil": "« Si le passage de l'eau te brûle comme un fer rouge, bois l'eau des poireaux jusqu'à ce que ton flux redevienne limpide. Ne retiens jamais tes eaux trop longtemps, car le mal profite de la stagnation pour s'enraciner. »", "relais": "Boire 2 litres d'eau par jour. Gélules de Canneberge (Cranberry_ Vaccinium macrocarpon ) ou de Busserole ( Arctostaphylos uva-ursi ). Hygiène rigoureuse.", "vigilance": "Consultez un médecin si : Fièvre, sang dans les urines, douleur dans le bas du dos ou brûlures qui persistent plus de 24–48 h (infection urinaire possible).", "kw": "vessie infection urinaire brûlures"}, {"name": "DARTRES", "subtitle": "Les Plaques de Sécheresse", "desc": "Plaques cutanées sèches et irritées.", "diag": "• Signes : Zones de peau rugueuse, rougeurs légères, desquamation fine. • Sensation : Tiraillement ou démangeaisons agaçantes.", "anciens": "Les dartres étaient perçues comme une impureté des humeurs cherchant à s'évacuer maladroitement par la peau. Le traitement visait à purifier l'intérieur pour apaiser l'extérieur.", "secret": "L'épinard, surnommé le « balai de l'estomac », nettoie le corps tandis que la lavande calme la chair. • Le Remède : Feuilles d'épinards blanchies ou décoction de Lavande. • L'Action : Appliquer les feuilles blanchies en cataplasme ou des compresses de lavande. • L'Effet : Rafraîchit la zone et aide la peau à retrouver sa souplesse.", "conseil": "« Frère, si ta peau se craquèle comme une terre sans pluie, ne la laisse pas s'enflammer. L'épinard nettoie ton sang des restes de viandes trop grasses. Au bivouac, protège ton visage du vent brûlant, car la peau est le rempart de ton corps contre les poussières du monde. »", "relais": "Argile verte prête à l'emploi. Eau florale de Lavande ou gel d'Aloe Vera. Crèmes hydratantes et baumes relipidants.", "vigilance": "Consultez si les plaques deviennent suintantes, douloureuses ou si elles s'étendent rapidement malgré les soins.", "kw": "peau squames rougeurs"}, {"name": "DÉPENDANCES", "subtitle": "Le Lien Invisible", "desc": "Besoin compulsif affaiblissant la volonté et l'esprit.", "diag": "• Signes : Nervosité excessive, agitation, fatigue morale profonde. • Sensation : Manque, insomnie de \"manque\", esprit tourmenté.", "anciens": "Les dépendances étaient vues comme une faiblesse de la volonté, où un désir extérieur venait enchaîner les \"esprits vitaux\" et corrompre le cœur.", "secret": "Un mélange de plantes sacrées pour redonner la maîtrise de soi. • Le Remède : Angélique ( Angelica archangelica ), Mélisse ( Melissa officinalis ), Valériane ( Valeriana officinalis ) et Aubépine ( Crataegus ). • L'Action : Jeter une grande cuillerée du mélange dans un bol d'eau frémissante. Couvrir et laisser infuser le temps de trois à quatre Pater noster. Boire tiède matin et soir. • L'Effet : Apaise l'esprit agité, soutient le repos et aide à traverser les tempêtes du manque avec plus de calme intérieur.", "conseil": "« Frère, nul n'est plus esclave que celui qui est enchaîné à ses propres penchants. Si ton esprit réclame ce qui le perd, cherche la force dans les racines de la terre et la prière. La valériane domptera ton agitation et l'angélique protégera ton âme du désespoir. »", "relais": "Tisanes relaxantes (Mélisse/Valériane). Supplémentation en Magnésium et Vitamines B.", "vigilance": "Un sevrage peut entraîner des réactions physiques sévères. Un accompagnement médico-psychologique est indispensable pour traiter la cause profonde.", "kw": "sevrage accoutumance"}, {"name": "DERMATOSES", "subtitle": "Le Feu de la Peau", "desc": "Irritations et rougeurs inflammatoires du derme.", "diag": "• Signes : Rougeurs diffuses, peau à vif, démangeaisons.", "anciens": "On y voyait une \"chaleur excessive\" du sang cherchant une issue par la peau. Il fallait \"tanner\" la chair pour la refermer et absorber le feu.", "secret": "Le Chêne ( Quercus ) resserre les tissus alors que l'Argile aspire la chaleur. • Le Remède : Décoction d'écorce de chêne et application d'argile verte. • L'Action : Faire frémir une poignée d'écorce de chêne dans une écuelle d'eau, puis laisser tiédir. Appliquer ensuite en compresse, ou étendre une fine couche d'argile sur la peau irritée. • L'Effet : Aide à assécher les suintements et apaise les échauffements de la peau.", "conseil": "« Quand le sang brûle, la peau s'irrite. Le chêne, arbre de force, tanne la chair pour la protéger comme un cuir neuf. Ne laisse jamais l'argile sécher sur ta plaie, garde-la humide comme la rosée du matin avec un peu d'eau claire. »", "relais": "Crèmes à base de cuivre et zinc (Cica-crèmes). Émollients protecteurs. Argile verte en pâte.", "vigilance": "Consultez si les lésions sont suintantes, infectées ou si elles s'accompagnent de fièvre.", "kw": "peau éruptions"}, {"name": "DIABÈTE", "subtitle": "Le Mal de la Soif", "desc": "Épuisement des forces internes lié à une chaleur sucrée.", "diag": "• Signes : Soif inextinguible, fatigue chronique, amaigrissement malgré la faim.", "anciens": "Le diabète était considéré comme une \"fusion\" des chairs : le corps, trop chaud, semblait se dissoudre dans les urines, laissant l'homme épuisé et assoiffé.", "secret": "La Cannelle ( Cinnamomum verum ) et le Curcuma ( Curcuma longa ) tempèrent les excès du sang. • Le Remède : Cannelle, Curcuma, Gingembre ( Zingiber officinale ) et Cumin ( Cuminum cyminum ). • L'Action : Ajouter généreusement ces poudres aux repas quotidiens avec un peu d'huile de noisette. • L'Effet : Aide le corps à mieux transformer sa nourriture et soutient la force vitale.", "conseil": "« Si l'eau ne suffit plus à calmer ta soif, c'est que ton feu intérieur est déréglé. Tempère tes humeurs par les épices rapportées d'Orient et fuis les douceurs qui trompent l'esprit et corrompent le corps. Un chevalier doit être de fer, non de miel. »", "relais": "Consommation de cannelle (gélules/infusions). Hygiène de vie rigoureuse : alimentation adaptée, gestion du poids et marche quotidienne.", "vigilance": "Le diabète nécessite une surveillance médicale stricte (endocrinologue). Un traitement par plantes ne remplace jamais l'insuline ou les traitements prescrits.", "kw": "sucre soif urines abondantes"}, {"name": "DIARRHÉES", "subtitle": "L'Écoulement des Entrailles", "desc": "Relâchement brutal et dangereux des intestins.", "diag": "• Signes : Selles liquides répétées, crampes, faiblesse générale. • Risque : Perte rapide des sels minéraux et de l'eau vitale.", "anciens": "Attribuées à une \"froideur\" et à une faiblesse de l'estomac, souvent dues à des eaux impures ou des chairs gâtées qui empêchent les intestins de retenir les aliments.", "secret": "Les puissants agents astringents pour \"resserrer\" ce qui est trop ouvert. • Le Remède : Décoction d'écorce de grenade, parfois accompagnée d'une pointe de muscade râpée. • L'Action : Faire frémir un morceau d'écorce de grenade dans une écuelle d'eau, puis boire le breuvage par petites gorgées au cours du jour. Une faible pincée de muscade pouvait être ajoutée pour &#x201C;réchauffer&#x201D; les entrailles. • L'Effet : Réputé resserrer les humeurs trop abondantes et redonner de la tenue au ventre.", "conseil": "« Quand les tripes se relâchent, la vie s'enfuit avec l'eau. Resserrer les entrailles par l'écorce de grenade ou la muscade. Bois l'eau de cuisson du riz, car elle est le rempart contre l'affaiblissement. En campagne, évite l'eau stagnante des fossés. »", "relais": "Solutés de réhydratation (SRO). Eau de riz. Probiotiques pour restaurer la flore.", "vigilance": "Consultez d'urgence en cas de sang dans les selles, de forte fièvre, ou si l'incapacité à garder les liquides persiste (risque de déshydratation grave).", "kw": "flux de ventre dysenterie"}, {"name": "DIGESTION DIFFICILE", "subtitle": "La Paresse de l'Estomac", "desc": "Lourdeur et somnolence après la prise de nourriture.", "diag": "• Signes : Ventre gonflé, impression que les aliments stagnent, fatigue post-prandiale.", "anciens": "L'estomac était vu comme un chaudron. S'il est trop \"froid\", il ne parvient pas à cuire la pitance, laissant les aliments pourrir et peser.", "secret": "Basilic ( Ocimum basilicum ), Camomille ( Chamaemelum nobile ) et Fenouil ( Foeniculum vulgare ) pour rallumer le feu digestif. • Le Remède : Infusion de Basilic, Camomille et de Fenouil. • L'Action : Jeter une pincée de basilic, deux pincées de camomille et une pincée de graines de fenouil dans une tasse d'eau frémissante. Couvrir et laisser infuser le temps d'une courte prière. Boire chaud après le repas principal. • L'Effet : Aide l'estomac à mieux &#x201C;transformer&#x201D; les aliments et dissipe les vents qui gonflent le ventre.", "conseil": "« Ne charge pas ton estomac plus qu'il ne peut porter avant de monter la garde. Si la somnolence te gagne après le repas, c'est que ton feu digestif s'éteint. Réveille-le par le fenouil et le basilic, herbes de clarté, et mâche longuement ta viande. »", "relais": "Tisanes digestives du commerce. Charbon végétal. Antiacides conseillés en pharmacie.", "vigilance": "Consultez si la lourdeur s'accompagne de vomissements fréquents, de brûlures répétées ou d'une perte de poids inexpliquée.", "kw": "dyspepsie lourdeurs estomac"}, {"name": "DOULEURS ARTICULAIRES", "subtitle": "(La Rouille des Membres)", "desc": "", "diag": "• Signes : Raideur au réveil, douleur augmentant au mouvement, gonflement. • Sensation : Impression que l'articulation est \"grippée\" ou \"serrée\".", "anciens": "Les douleurs des jointures étaient perçues comme une accumulation d'humeurs froides qui \"s'endorment\" dans les articulations, empêchant le flux naturel de la chaleur vitale.", "secret": "La Reine-des-prés ( Filipendula ulmaria ) est le baume des chevaliers pour délier les membres fatigués et apaiser les douleurs des articulations. • Le Remède : Infusion de sommités fleuries ou friction d'huile au Gingembre ( Zingiber officinale ) et au Curcuma ( Curcuma longa ). L'Action : Jeter une petite poignée de fleurs dans une tasse d'eau frémissante et laisser infuser à couvert le temps d'une courte prière. Pour les frictions, faire macérer gingembre et curcuma dans l'huile avant d'en masser doucement les membres endoloris. • L'Effet : Aide à calmer les échauffements des chairs et à rendre aux membres une plus grande souplesse de mouvement.", "conseil": "« Frère, si tes membres grincent comme un vieux chariot sur les routes de pierre, ne laisse pas le froid de l'hiver s'installer. Frictionne tes jointures avec le feu du gingembre avant de revêtir ton armure, car une articulation souple est le gage d'une parade victorieuse. »", "relais": "Gélules d'Harpagophytum ou duo Curcuma-Gingembre. Gels à base d'Arnica ou de Gaulthérie.", "vigilance": "Attention : La Reine-des-prés est à exclure en cas d'allergie à l'aspirine. Consultez si l'articulation est rouge, brûlante et s'accompagne de fièvre.", "kw": "rhumatismes goutte articulations"}, {"name": "DOULEURS INTESTINALES", "subtitle": "Le Nœud du Ventre", "desc": "Contraction froide des entrailles provoquant des spasmes.", "diag": "• Signes : Crampes vives, ballonnements, sensation de \"ventre noué\".", "anciens": "Liées à une contraction \"froide\" des intestins. On pensait que les vents piégés cherchaient à s'échapper, provoquant ces torsions douloureuses.", "secret": "Le Bouillon-blanc ( Verbascum thapsus ) apporte la douceur nécessaire pour détendre la chair. • Le Remède : Infusion de fleurs séchées de bouillon-blanc. • L'Action : Jeter une pincée de fleurs dans une tasse d'eau frémissante, couvrir et laisser tirer le temps d'une courte prière. Filtrer soigneusement à travers un linge fin afin d'ôter les petits poils irritants, puis boire après les repas. • L'Effet : Aide à apaiser les irritations des intestins et à relâcher les contractions du ventre.", "conseil": "« Mange dans le calme de la commanderie et évite les cris durant la pitance. Celui qui avale ses soucis avec sa viande finit par nouer ses entrailles. La douceur du bouillon-blanc est le rempart contre le stress qui tord les tripes du guerrier. »", "relais": "Tisanes de Mélisse ( Melissa officinalis ) ou de Menthe poivrée ( Mentha × piperita ). Charbon végétal pour absorber les gaz. Antispasmodiques classiques.", "vigilance": "Consultez si la douleur est insoutenable, si elle s'accompagne de vomissements ou si vous constatez du sang dans les selles.", "kw": "ventre intestins"}, {"name": "ECZÉMA", "subtitle": "L'Ardeur de l'Écorce", "desc": "Manifestation externe d'un déséquilibre interne de la chaleur.", "diag": "• Signes : Plaques rouges inflammatoires, démangeaisons intenses, peau rugueuse.", "anciens": "L'eczéma était vu comme une \"ébullition\" des humeurs cherchant une sortie par la peau. Il fallait assécher le mal par les forces de l'arbre et de la terre.", "secret": "Le duo souverain pour tanner et absorber le feu. • Le Remède : Décoction d'écorce de chêne et cataplasme d'argile verte. • L'Action : Appliquer des compresses de chêne froides. Pour l'argile, ne jamais la laisser sécher sur la peau (vaporiser de l'eau). • L'Effet : Resserre les chairs à vif et calme l'incendie cutané.", "conseil": "« Si ta peau brûle sous ta cotte de mailles, c'est que ton sang s'échauffe par manque de repos. Purifie-toi à l'eau de chêne et garde ta peau propre, car la sueur est le terreau de l'irritation. Un corps purifié de l'intérieur offre une peau lisse à l'extérieur. »", "relais": "Crèmes cuivre-zinc (Cica-crèmes). Baumes relipidants hydratants. Dermocorticoïdes sur prescription médicale.", "vigilance": "Consultez si les plaques deviennent suintantes (jaunâtres), si elles s'étendent au visage ou si la douleur empêche le sommeil.", "kw": "peau démangeaisons plaques"}, {"name": "ÉPILEPSIE", "subtitle": "Le Tourment des Astres", "desc": "Perturbation violente et soudaine des esprits vitaux.", "diag": "• Signes : Convulsions, perte de conscience, secousses involontaires.", "anciens": "Nommée \"Haut Mal\", l'épilepsie était perçue comme une tempête frappant le cerveau, souvent attribuée à des influences internes ou célestes déséquilibrant l'âme.", "secret": "Le Frêne ( Fraxinus excelsior ) était utilisé pour son pouvoir d'ancrage. • Usage Historique : Infusion légère de feuilles et fleurs de frêne. • Note : Le Gui ( Viscum album ), autrefois cité, est toxique et strictement proscrit par voie orale aujourd'hui.", "conseil": "« Si un frère est jeté à terre par le Haut Mal, ne tente point de lui entraver les membres. Éloigne les épées et les pierres dures pour qu'il ne s'y brise point. Ne mets rien dans sa bouche. Attends que la tempête passe et veille sur lui comme sur un enfant. »", "relais": "Aucun traitement naturel reconnu. Seul un neurologue peut poser un diagnostic et prescrire un traitement antiépileptique adapté.", "vigilance": "Urgence vitale (15/112) : Si la crise dure plus de 5 minutes, si les crises s'enchaînent ou si la personne s'est blessée dans sa chute.", "kw": "haut mal convulsions crises"}, {"name": "ÉTATS FÉBRILES", "subtitle": "La Fièvre de Campement", "desc": "Lutte ardente du corps contre les humeurs corrompues.", "diag": "• Signes : Chaleur corporelle (> 38°C), frissons, maux de tête, faiblesse.", "anciens": "La fièvr
